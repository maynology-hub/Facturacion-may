<style>
:root{
  --verde-osc:#19194f;
  --verde:#8f1296;
  --verde-fuerte:#873ca8;
  --verde-claro:#F5EBFB;
  --verde-pastel:#ECD9F5;
  --rosa:#FFD1EE;
  --rosa-claro:#FBF3FC;
  --rosa-fuerte:#ff00ab;
  --marron:#4f3479;
  --marron-claro:#ECE3F5;
  --crema:#FAF8FC;
  --blanco:#FFFFFF;
  --gris:#A79FBE;
  --gris-txt:#5C5478;
  --rojo:#E2879A;
  --rojo-bg:#FCE6EB;
  --rojo-txt:#B1516B;
  --amar-bg:#FFE0F3;
  --amar-txt:#C4008C;
  --verde-bg:#F0E3F7;
  --verde-txt:#6F2F8A;
  --borde:#E6DDF0;
  --morado:#873ca8;
  --morado-fuerte:#6F2F8A;
  --morado-claro:#F0E3F7;
  --dorado:#ff00ab;
  --dorado-claro:#FFE0F3;
  --lila-icono:#8f1296;
  --lila-claro:#F5E1F2;
  --font: 'Nunito', 'Segoe UI', system-ui, -apple-system, Arial, sans-serif;
  --font-title: 'Quicksand', var(--font);
}
*{box-sizing:border-box;}
body{margin:0;font-family:var(--font);background:var(--crema);color:#41504A;}
#app{display:flex;min-height:100vh;}

/* ---------- SIDEBAR ---------- */
.sidebar{
  width:250px;flex-shrink:0;background:linear-gradient(180deg,var(--verde-osc),#4f3479);
  color:#fff;display:flex;flex-direction:column;position:sticky;top:0;height:100vh;overflow-y:auto;
}
.sidebar .brand{padding:22px 18px 18px;display:flex;align-items:center;gap:12px;}
.sidebar .brand .logo-box{width:44px;height:44px;flex-shrink:0;border-radius:13px;background:#fff;padding:5px;
  display:flex;align-items:center;justify-content:center;font-size:19px;box-shadow:0 4px 10px rgba(0,0,0,.18);}
.sidebar .brand .name{font-family:var(--font-title);font-weight:700;font-size:16.5px;letter-spacing:.2px;line-height:1.2;}
.sidebar .brand .tag{font-size:11px;color:var(--dorado);font-weight:700;margin-top:2px;}
.sidebar nav{flex:1;padding:8px 14px;}
.sidebar button.navbtn{
  display:flex;align-items:center;gap:11px;width:100%;text-align:left;background:none;border:none;
  color:#DCC9EE;padding:9px 14px;font-size:13.3px;cursor:pointer;border-radius:13px;margin-bottom:4px;
  transition:background .15s,color .15s;font-family:var(--font);font-weight:600;
}
.sidebar button.navbtn:hover{background:rgba(255,255,255,.08);color:#fff;}
.sidebar button.navbtn.active{background:linear-gradient(135deg,var(--morado),var(--morado-fuerte));color:#fff;font-weight:700;box-shadow:0 4px 12px rgba(0,0,0,.16);}
.sidebar .icon-circle{
  width:31px;height:31px;border-radius:50%;background:rgba(255,255,255,.13);
  display:flex;align-items:center;justify-content:center;flex-shrink:0;transition:background .15s;
}
.sidebar button.navbtn.active .icon-circle{background:rgba(255,255,255,.24);}
.sidebar .icon{font-size:14px;line-height:1;}

/* ---------- MAIN ---------- */
main{flex:1;padding:22px 30px 60px;max-width:1360px;}
.topbar-status-row{display:flex;justify-content:flex-end;margin-bottom:10px;}
.nube-mini{display:inline-flex;align-items:center;gap:7px;background:#fff;border:1px solid var(--borde);
  border-radius:20px;padding:5px 13px;font-size:11.5px;box-shadow:0 1px 4px rgba(120,90,160,.08);}
.topbar{
  display:flex;flex-wrap:wrap;gap:14px;align-items:stretch;margin-bottom:20px;
}
.tbcard{background:#fff;border:1px solid var(--borde);border-radius:16px;padding:14px 20px;
  box-shadow:0 2px 10px rgba(120,90,160,.08);display:flex;align-items:center;gap:14px;flex:1;min-width:220px;}
.tb-ic{width:40px;height:40px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:18px;flex-shrink:0;}
.tb-ic.dorado{background:var(--dorado-claro);}
.tb-ic.morado{background:var(--morado-claro);}
.tb-ic.lila{background:var(--lila-claro);}
.tb-body{flex:1;}
.tb-body label{display:block;font-weight:700;font-size:12.5px;color:var(--gris-txt);margin-bottom:4px;white-space:nowrap;}
.topbar input{padding:7px 10px;border:1px solid var(--borde);border-radius:10px;font-size:13px;background:var(--rosa-claro);font-family:var(--font);}
.topbar input#tasaDolar{width:100%;font-weight:700;font-family:var(--font-title);font-size:21px;color:var(--verde-osc);border:none;background:transparent;padding:0;}
.nube-dot{width:8px;height:8px;border-radius:50%;display:inline-block;background:#9aa0a6;flex-shrink:0;}
.nube-dot.conectado{background:#873ca8;box-shadow:0 0 0 2px rgba(135,60,168,.18);}
.nube-dot.local{background:#B0B0B0;}
.nube-dot.error{background:#D9534F;box-shadow:0 0 0 2px rgba(217,83,79,.18);}
.nube-dot.verificando{background:#ff00ab;animation:parpadeo 1.2s infinite;}
@keyframes parpadeo{0%,100%{opacity:1;}50%{opacity:.35;}}
.nube-txt{font-weight:700;font-size:11.5px;color:var(--gris-txt);}
.topbar input#filtroFecha{width:130px;}
.topbar input#filtroMes{width:120px;}

.pagehead{display:flex;align-items:center;justify-content:space-between;margin-bottom:16px;flex-wrap:wrap;gap:10px;}
.pagehead h1{font-family:var(--font-title);font-size:24px;margin:0;color:var(--verde-osc);font-weight:700;}
.pagehead .sub{font-size:13px;color:var(--gris);margin-top:3px;}
.pagehead-ic-title{display:flex;align-items:center;gap:16px;}
.pagehead-ic{width:52px;height:52px;border-radius:16px;background:var(--verde-claro);display:flex;align-items:center;justify-content:center;font-size:24px;flex-shrink:0;}

.card{background:#fff;border:1px solid var(--borde);border-radius:16px;padding:20px 22px;margin-bottom:18px;box-shadow:0 2px 10px rgba(120,90,160,.08);}
.card h2{font-family:var(--font-title);font-size:14.5px;margin:0 0 14px;color:var(--verde-osc);letter-spacing:.2px;}

/* KPI cards */
.kpi-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(190px,1fr));gap:12px;margin-bottom:20px;}
.kpi{background:linear-gradient(135deg,var(--verde-osc),var(--verde-fuerte));border-radius:16px;padding:16px 18px;color:#fff;border-left:4px solid var(--rosa);}
.kpi .t{font-size:10.5px;letter-spacing:.4px;text-transform:uppercase;color:#E4CDF2;margin-bottom:6px;font-weight:700;}
.kpi .v{font-family:var(--font-title);font-size:21px;font-weight:700;color:#fff;}
.kpi .v2{font-size:11px;color:#E4CDF2;margin-top:2px;}
.kpi.verde{background:linear-gradient(135deg,#6F2F8A,#873ca8);border-left-color:#F0E3F7;}
.kpi.amar{background:linear-gradient(135deg,#C4008C,#ff00ab);border-left-color:#FFE0F3;}
.kpi.rojo{background:linear-gradient(135deg,#C97389,#E393A9);border-left-color:#FCE6EB;}

/* Table */
.table-wrap{overflow-x:auto;max-height:480px;overflow-y:auto;}
table{width:100%;border-collapse:collapse;font-size:12.8px;}
thead th{background:var(--verde);color:#fff;text-align:left;padding:10px 10px;font-weight:700;white-space:nowrap;position:sticky;top:0;}
tbody td{padding:9px 10px;border-bottom:1px solid var(--borde);}
tbody tr:hover{background:var(--verde-claro);}
tbody tr:nth-child(even){background:#FBFDFB;}
tbody tr:nth-child(even):hover{background:var(--verde-claro);}
.badge{display:inline-block;padding:3px 10px;border-radius:20px;font-size:11px;font-weight:700;white-space:nowrap;}
.badge.rojo{background:var(--rojo-bg);color:var(--rojo-txt);}
.badge.amar{background:var(--amar-bg);color:var(--amar-txt);}
.badge.verde{background:var(--verde-bg);color:var(--verde-txt);}
.badge.azul{background:#E7E1F5;color:#4f3479;}

.row-actions{white-space:nowrap;}
.row-actions button{border:none;background:none;cursor:pointer;font-size:13px;padding:3px 6px;border-radius:8px;}
.row-actions button:hover{background:var(--verde-claro);}
.row-actions .del:hover{background:var(--rojo-bg);}

/* Buttons */
.btn{display:inline-flex;align-items:center;gap:6px;border:none;border-radius:12px;padding:10px 18px;font-size:13px;font-weight:700;cursor:pointer;transition:filter .15s,transform .1s;font-family:var(--font);}
.btn:hover{filter:brightness(1.05);}
.btn:active{transform:scale(.98);}
.btn-primary{background:var(--verde-osc);color:#fff;}
.btn-outline{background:#fff;color:var(--verde-osc);border:1.5px solid var(--verde);}
.btn-danger{background:var(--rojo-bg);color:var(--rojo-txt);}
.btn-success{background:var(--verde-bg);color:var(--verde-txt);}
.btn-sm{padding:7px 12px;font-size:12px;border-radius:10px;}
.btn-block{width:100%;justify-content:center;}

.field{margin-bottom:12px;}
.field label{display:block;font-size:11.5px;font-weight:700;color:var(--gris-txt);margin-bottom:4px;}
.field input,.field select,.field textarea{
  width:100%;padding:9px 11px;border:1px solid var(--borde);border-radius:10px;font-size:13px;font-family:var(--font);background:var(--verde-claro);
}

.recibo-card{background:linear-gradient(160deg,var(--verde-claro),#fff);border:2px dashed var(--verde);border-radius:18px;padding:22px 20px;text-align:center;}
.recibo-emoji{font-size:30px;margin-bottom:2px;}
.recibo-brand{font-family:var(--font-title);font-weight:700;color:var(--verde-osc);font-size:15.5px;}
.recibo-doc{font-size:12px;color:var(--gris-txt);margin-top:3px;}
.recibo-fecha{font-size:11px;color:var(--gris);margin-top:1px;}
.recibo-dashed{border-top:1.5px dashed var(--verde);margin:14px 0;}
.recibo-cliente{font-size:13.5px;color:var(--gris-txt);text-align:left;margin-bottom:8px;}
.recibo-items{text-align:left;}
.recibo-item{display:flex;justify-content:space-between;gap:10px;font-size:12.5px;padding:4px 0;color:#41504A;}
.recibo-estado{margin-bottom:10px;}
.recibo-total-lbl{font-size:11px;letter-spacing:.6px;text-transform:uppercase;color:var(--gris-txt);margin-top:4px;font-weight:700;}
.recibo-total-usd{font-family:var(--font-title);font-size:32px;font-weight:700;color:var(--verde-osc);margin-top:2px;}
.recibo-total-bs{font-size:16.5px;font-weight:700;color:#C4008C;background:var(--dorado-claro);display:inline-block;padding:7px 18px;border-radius:20px;margin-top:8px;}
.recibo-tasa{font-size:11px;color:var(--gris);margin-top:9px;}
.recibo-obs{margin-top:14px;background:var(--amar-bg);color:var(--amar-txt);border-radius:10px;padding:9px 12px;font-size:12px;text-align:left;}

.field input:focus,.field select:focus,.field textarea:focus{outline:2px solid var(--rosa-fuerte);outline-offset:1px;}

.autocomplete-wrap{position:relative;}
.autocomplete-list{position:absolute;left:0;right:0;top:100%;z-index:60;background:#fff;border:1px solid var(--borde);
  border-radius:12px;max-height:230px;overflow-y:auto;margin-top:4px;box-shadow:0 10px 26px rgba(60,90,70,.16);}
.autocomplete-item{padding:9px 12px;font-size:12.8px;cursor:pointer;color:#41504A;border-bottom:1px solid var(--verde-claro);}
.autocomplete-item:last-child{border-bottom:none;}
.autocomplete-item:hover{background:var(--verde-claro);}

.notice{background:var(--rosa-claro);color:#8A4A5C;border-radius:14px;padding:12px 16px;font-size:12.5px;margin-bottom:16px;display:flex;gap:10px;align-items:flex-start;}
.notice b{white-space:nowrap;}
.empty{padding:30px;text-align:center;color:var(--gris);font-size:13px;}
.empty-cart{padding:44px 20px;text-align:center;}
.empty-cart-ic{font-size:15px;margin-bottom:14px;position:relative;display:inline-block;}
.empty-cart-ic span{font-size:40px;display:block;}
.empty-cart b{display:block;font-family:var(--font-title);font-size:16.5px;color:var(--verde-osc);margin-bottom:5px;}
.empty-cart span.cta{font-size:12.5px;color:var(--gris);}
.empty-cart > span:last-child{font-size:12.5px;color:var(--gris);}

.two-col{display:grid;grid-template-columns:1fr 1.4fr;gap:18px;align-items:start;}
@media (max-width:900px){ .two-col{grid-template-columns:1fr;} }

.totales-box{background:var(--verde-claro);border:1px solid var(--borde);border-radius:12px;padding:14px 16px;margin-top:6px;}
.totales-box .row{display:flex;justify-content:space-between;font-size:12.5px;color:var(--gris-txt);padding:3px 0;}
.totales-box .grand{font-family:var(--font-title);font-size:17px;font-weight:700;color:var(--verde-osc);margin-top:6px;}
.totales-box .grand2{font-size:14px;font-weight:700;color:var(--morado-fuerte);}

/* Modal */
.overlay{position:fixed;inset:0;background:rgba(60,80,65,.35);display:none;align-items:center;justify-content:center;z-index:50;padding:20px;}
.overlay.show{display:flex;}
.modal{background:#fff;border-radius:18px;padding:24px 28px 26px;width:100%;max-width:560px;max-height:88vh;overflow-y:auto;}
.modal h3{font-family:var(--font-title);margin:0 0 16px;color:var(--verde-osc);font-size:17px;}
.modal-actions{display:flex;justify-content:flex-end;gap:10px;margin-top:16px;}

.pos-wrap{display:grid;grid-template-columns:1fr 300px;gap:18px;align-items:start;}
@media (max-width:1050px){ .pos-wrap{grid-template-columns:1fr;} }
.pos-main{background:#fff;border:1px solid var(--borde);border-radius:18px;padding:20px 22px;box-shadow:0 2px 10px rgba(120,90,160,.08);}
.pos-cliente{display:flex;align-items:center;gap:12px;margin-bottom:14px;flex-wrap:wrap;}
.pos-cliente label{font-family:var(--font-title);font-weight:700;color:var(--verde-osc);font-size:13.5px;white-space:nowrap;}
.pos-cliente input{flex:1;min-width:220px;padding:11px 14px;border:1.5px solid var(--verde);border-radius:12px;font-size:14px;background:var(--verde-claro);font-family:var(--font);}
.pos-entry{display:grid;grid-template-columns:2fr 1fr 1fr 90px;gap:10px;align-items:end;background:var(--verde-claro);border-radius:14px;padding:14px 16px;margin-bottom:16px;}
.pos-entry .field{margin-bottom:0;}
.pos-entry .addbtn{background:var(--verde-osc);color:#fff;border:none;border-radius:12px;height:38px;font-weight:700;cursor:pointer;font-size:13px;}
.pos-entry .addbtn:hover{filter:brightness(1.08);}
.pos-items thead th{background:var(--verde-osc);color:#fff;}
.pos-items tbody tr.destacado{background:var(--verde-claro);}
.pos-side{background:#fff;border:1px solid var(--borde);box-shadow:0 2px 10px rgba(120,90,160,.08);border-radius:18px;padding:20px;position:sticky;top:20px;}
.pos-side .doc{display:flex;align-items:center;gap:10px;font-size:11px;color:var(--gris);letter-spacing:.3px;margin-bottom:16px;}
.pos-side .doc-ic{width:34px;height:34px;border-radius:10px;background:var(--morado-claro);display:flex;align-items:center;justify-content:center;font-size:15px;flex-shrink:0;}
.pos-side .doc b{color:var(--verde-osc);font-family:var(--font-title);font-size:14px;}
.pos-side .total-lbl{font-size:11px;color:var(--gris-txt);letter-spacing:.6px;text-transform:uppercase;margin-bottom:8px;font-weight:700;}
.pos-side .total-bs{font-family:var(--font-title);font-size:32px;font-weight:700;color:#fff;background:linear-gradient(135deg,var(--verde-osc),var(--verde-fuerte));border-radius:14px;padding:16px 14px;text-align:center;margin-bottom:10px;}
.pos-side .total-usd{background:var(--verde-claro);color:var(--morado-fuerte);border-radius:12px;padding:10px 14px;text-align:center;font-size:16px;font-weight:700;margin-bottom:16px;}
.pos-side .mini-row{display:flex;justify-content:space-between;font-size:12.5px;color:var(--gris-txt);padding:6px 0;border-bottom:1px solid var(--borde);}
.pos-side .field label{color:var(--gris-txt);}
.pos-side .btn-block{margin-top:8px;}
.btn-accent{background:linear-gradient(135deg,var(--dorado),#C4008C);color:#fff;box-shadow:0 4px 12px rgba(255,0,171,.32);}

/* ---------- RESPONSIVE / MÓVIL ---------- */
.hamburger{display:none;position:fixed;top:14px;left:14px;z-index:70;background:var(--verde-osc);color:#fff;
  border:none;border-radius:10px;width:40px;height:40px;font-size:18px;cursor:pointer;box-shadow:0 2px 10px rgba(0,0,0,.2);}
.sidebar-scrim{display:none;position:fixed;inset:0;background:rgba(0,0,0,.4);z-index:59;}
@media (max-width:860px){
  .hamburger{display:block;}
  #app{display:block;}
  .sidebar{position:fixed;left:0;top:0;z-index:60;transform:translateX(-100%);transition:transform .2s ease;width:230px;}
  .sidebar.abierto{transform:translateX(0);}
  .sidebar-scrim.show{display:block;}
  main{padding:64px 14px 50px;max-width:100%;}
  .topbar{padding:12px 14px;gap:10px;}
  .topbar .grp{width:100%;justify-content:space-between;}
  .topbar input#tasaDolar,.topbar input#filtroFecha,.topbar input#filtroMes{width:auto;flex:1;}
  .pagehead h1{font-size:19px;}
  .kpi-grid{grid-template-columns:1fr 1fr;}
  .card{padding:16px;}
  .pos-entry{grid-template-columns:1fr 1fr;}
  .pos-entry .addbtn{grid-column:1/-1;}
  table{font-size:11.8px;}
}
@media (max-width:420px){
  .kpi-grid{grid-template-columns:1fr;}
}
</style>
</head>

    eliminados: { facturas: [], clientes: [], catalogo: [], egresos: [] },

function loadState(){

  }catch(e){ console.error('No se pudo leer el almacenamiento local', e); }

// Trae la tasa oficial publicada por el BCV desde una fuente pública que la replica.
// manual=true (botón "Actualizar") muestra avisos; manual=false (automático al abrir) es silencioso.
async function actualizarTasaBCV(manual){
  const btn = document.getElementById('btnActualizarTasaBCV');
  if(btn){ btn.disabled = true; btn.textContent = '&#8987;'; btn.innerHTML='&#8987;'; }
  try{
    const resp = await fetch('https://ve.dolarapi.com/v1/dolares/oficial');
    if(!resp.ok) throw new Error('Respuesta no válida del servicio');
    const data = await resp.json();
    const nueva = parseFloat(data.promedio);
    if(!nueva || nueva<=0) throw new Error('Tasa inválida recibida');
    if(Math.abs(nueva - state.tasaActual) > 0.0001){
      if(!state.historialTasas) state.historialTasas = [];
      state.historialTasas.push({fecha: hoyStr(), hora: new Date().toLocaleTimeString('es-VE'), tasa: nueva});
      if(state.historialTasas.length > 200) state.historialTasas.shift();
    }
    state.tasaActual = nueva;
    state.ultimaActualizacionBCV = hoyStr();
    saveState(); render();
    if(manual) alert('Tasa actualizada desde el BCV: '+nueva.toFixed(2)+' Bs/$');
  }catch(error){
    console.warn('No se pudo actualizar la tasa BCV automáticamente:', error);
    if(manual) alert('No se pudo obtener la tasa del BCV en este momento (revisa tu conexión a internet). Puedes escribirla manualmente como siempre.');
  }
}

// Garantiza que el contador de facturas nunca quede por debajo de lo ya emitido
// (importante para datos guardados antes de esta función existir).
function asegurarContadorFactura(){
  let maxNum = 0;
  (state.facturas||[]).forEach(f=>{
    const m = /FAC-(\d+)/.exec(f.numeroFactura||'');
    if(m) maxNum = Math.max(maxNum, parseInt(m[1],10));
  });
  if(!state.contadorFactura || state.contadorFactura <= maxNum){
    state.contadorFactura = maxNum + 1;
  }
}

function registrarRespaldoAutomatico(){
  if(!state.backups) state.backups = [];
  const hoy = hoyStr();
  const yaHoy = state.backups.find(b=>b.fecha===hoy);
  const snapshot = JSON.stringify(Object.assign({}, state, {backups: undefined}));
  if(yaHoy){
    yaHoy.data = snapshot; // sobrescribe el respaldo del día con la versión más reciente
  } else {
    state.backups.push({fecha: hoy, hora: new Date().toLocaleTimeString('es-VE'), data: snapshot});
    if(state.backups.length > 7) state.backups.shift(); // conserva los últimos 7 días
  }
}

function saveState(){
  registrarRespaldoAutomatico();
  try{ localStorage.setItem(STORAGE_KEY, JSON.stringify(state)); }
  catch(e){ console.error('No se pudo guardar en localStorage', e); }
  if(window.guardarEnNube){ window.guardarEnNube(state); }
  if(dataFileHandle){ guardarEnArchivoUSB(); }
}

function restaurarRespaldo(fecha){
  const b = (state.backups||[]).find(x=>x.fecha===fecha);
  if(!b) return;
  if(!confirm(`¿Restaurar los datos del ${fecha}? Esto reemplazará TODO lo que tengas ahora mismo.`)) return;
  const backupsActuales = state.backups;
  const datosRestaurados = JSON.parse(b.data);
  state = Object.assign(seedState(), datosRestaurados);
  state.backups = backupsActuales;
  asegurarContadorFactura();
  saveState(); render();
  alert('Respaldo restaurado.');
}

// MODO PORTÁTIL USB
let dataFileHandle = null;
const FS_SUPPORTED = 'showOpenFilePicker' in window;

function idbAbrir(){
  return new Promise((resolve,reject)=>{
    const req = indexedDB.open('sfd-handles-db', 1);
    req.onupgradeneeded = () => { req.result.createObjectStore('handles'); };
    req.onsuccess = () => resolve(req.result);
    req.onerror = () => reject(req.error);
  });
}
async function idbGuardarHandle(handle){
  try{
    const db = await idbAbrir();
    await new Promise((res,rej)=>{
      const tx = db.transaction('handles','readwrite');
      tx.objectStore('handles').put(handle, 'archivoDatos');
      tx.oncomplete = res; tx.onerror = () => rej(tx.error);
    });
  }catch(e){}
}
async function idbLeerHandle(){
  try{
    const db = await idbAbrir();
    return await new Promise((res,rej)=>{
      const tx = db.transaction('handles','readonly');
      const req = tx.objectStore('handles').get('archivoDatos');
      req.onsuccess = () => res(req.result || null);
      req.onerror = () => rej(req.error);
    });
  }catch(e){ return null; }
}
async function crearArchivoDatosUSB(){
  if(!FS_SUPPORTED){ alert('Navegador no compatible con USB.'); return; }
  try{
    const handle = await window.showSaveFilePicker({
      suggestedName: 'datos-sistema-comercial.json',
      types: [{description:'Datos del Sistema Comercial', accept:{'application/json':['.json']}}]
    });
    dataFileHandle = handle;
    await idbGuardarHandle(handle);
    await guardarEnArchivoUSB();
    actualizarEstadoConexionArchivo();
    alert('Listo. Guardado en tu USB.');
  }catch(e){}
}
async function conectarArchivoDatosUSB(){
  if(!FS_SUPPORTED){ alert('Navegador no compatible con USB.'); return; }
  try{
    const [handle] = await window.showOpenFilePicker({
      types: [{description:'Datos del Sistema Comercial', accept:{'application/json':['.json']}}]
    });
    dataFileHandle = handle;
    await idbGuardarHandle(handle);
    if(confirm('¿Cargar datos de este archivo?')){ await cargarDesdeArchivoUSB(); } 
    else { await guardarEnArchivoUSB(); }
    actualizarEstadoConexionArchivo();
  }catch(e){}
}
async function guardarEnArchivoUSB(){
  if(!dataFileHandle) return;
  try{
    const perm = await dataFileHandle.requestPermission({mode:'readwrite'});
    if(perm !== 'granted') return;
    const writable = await dataFileHandle.createWritable();
    await writable.write(JSON.stringify(state, null, 2));
    await writable.close();
  }catch(e){}
}
async function cargarDesdeArchivoUSB(){
  if(!dataFileHandle) return;
  try{
    const perm = await dataFileHandle.requestPermission({mode:'readwrite'});
    if(perm !== 'granted') return;
    const file = await dataFileHandle.getFile();
    const texto = await file.text();
    if(texto && texto.trim()){
      state = Object.assign(seedState(), JSON.parse(texto));
      saveState(); render();
    }
  }catch(e){}
}
async function intentarReconectarArchivoUSB(){
  if(!FS_SUPPORTED) return;
  const handle = await idbLeerHandle();
  if(!handle) return;
  try{
    const perm = await handle.queryPermission({mode:'readwrite'});
    if(perm === 'granted'){ dataFileHandle = handle; actualizarEstadoConexionArchivo(); }
  }catch(e){}
}
function actualizarEstadoConexionArchivo(){
  const el = document.getElementById('estadoArchivoUSB');
  if(!el) return;
  el.innerHTML = dataFileHandle
    ? `&#9989; Conectado a: <b>${dataFileHandle.name}</b>.`
    : (FS_SUPPORTED ? `&#9888;&#65039; Sin archivo USB conectado.` : `&#10060; Navegador sin soporte USB.`);
}

// UTILIDADES
const fmtUSD = n => (Number(n)||0).toFixed(2) + ' $';
const fmtBs  = n => (Number(n)||0).toLocaleString('es-VE',{minimumFractionDigits:2,maximumFractionDigits:2}) + ' Bs';
const uid = () => Date.now() + Math.floor(Math.random()*1000);
// Fecha de HOY según la hora LOCAL del dispositivo (nunca UTC, para no adelantarse de día por la noche en Venezuela).
const hoyStr = () => {
  const d = new Date();
  return `${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}-${String(d.getDate()).padStart(2,'0')}`;
};
const DIAS_SEM = ['Domingo','Lunes','Martes','Miércoles','Jueves','Viernes','Sábado'];
const MESES_L = ['Enero','Febrero','Marzo','Abril','Mayo','Junio','Julio','Agosto','Septiembre','Octubre','Noviembre','Diciembre'];

function fmtDatePretty(d){
  if(!d) return '';
  const dt = new Date(d+'T00:00:00');
  if(isNaN(dt)) return d;
  return `${DIAS_SEM[dt.getDay()]} ${dt.getDate()} de ${MESES_L[dt.getMonth()]} de ${dt.getFullYear()}`;
}
function diasDesde(fecha){
  const dt = new Date(fecha+'T00:00:00');
  const hoy = new Date(hoyStr()+'T00:00:00');
  const diff = Math.round((hoy-dt)/86400000);
  return diff>=0 ? diff : 0;
}
function badgeEstado(e){
  const map = {Cancelado:'verde', Pendiente:'amar', Abonado:'azul'};
  return `<span class="badge ${map[e]||'amar'}">${e}</span>`;
}
// Cuánto falta por pagar de una factura, considerando abonos parciales ya registrados
// Marca un id como "borrado a propósito" en la categoría indicada (facturas/clientes/catalogo/egresos),
// para que al sincronizar con la nube no vuelva a aparecer. Guarda como máximo los últimos 1000.
function registrarBorrado(categoria, id){
  if(!state.eliminados) state.eliminados = { facturas: [], clientes: [], catalogo: [], egresos: [] };
  if(!state.eliminados[categoria]) state.eliminados[categoria] = [];
  if(!state.eliminados[categoria].includes(id)){
    state.eliminados[categoria].push(id);
    if(state.eliminados[categoria].length > 1000) state.eliminados[categoria].shift();
  }
}
function saldoFactura(f){
  return Math.max(0, (f.totalUSD||0) - (f.montoAbonadoUSD||0));
}
// Cuánto dinero ha entrado REALMENTE de una factura, ya sea que esté Cancelada
// (pagada de una vez) o Abonada (pago parcial) — esto es lo que debe contar como "cobrado".
function montoCobradoUSD(f){
  return f.montoAbonadoUSD||0;
}
function montoCobradoBS(f){
  // Si tiene abonos registrados, cada uno se cobró a la tasa de su propio día — se suman tal cual.
  if(f.abonos && f.abonos.length){
    return f.abonos.reduce((s,a)=>s+(a.montoBS!=null ? a.montoBS : a.montoUSD*(a.tasaHistorica||state.tasaActual)),0);
  }
  // Pagada de una sola vez al crearla (sin pasar por el flujo de abonos): usa el Bs congelado de la factura.
  return (f.montoAbonadoUSD||0)>0 ? f.totalBS : 0;
}
// Conversión bidireccional: escribes en $ y se calcula Bs, o escribes en Bs y se calcula $.
// origen indica cuál de los dos campos acaba de editar el usuario.
function sincronizarMoneda(idUSD, idBS, origen){
  const elU = document.getElementById(idUSD), elB = document.getElementById(idBS);
  if(!elU || !elB || !state.tasaActual) return;
  if(origen==='usd'){
    const usd = parseFloat(elU.value)||0;
    elB.value = usd>0 ? (usd*state.tasaActual).toFixed(2) : '';
  } else {
    const bs = parseFloat(elB.value)||0;
    elU.value = bs>0 ? (bs/state.tasaActual).toFixed(4) : '';
  }
}

function calcularEstadisticas(){
  const fF = facturasFiltradas();
  const eF = egresosFiltrados();
  const totalVentasUSD = fF.reduce((s,f)=>s+f.totalUSD,0);
  const totalVentasBS = fF.reduce((s,f)=>s+f.totalBS,0);
  const cobradas = fF.filter(f=>(f.montoAbonadoUSD||0)>0);
  const totalCobradoUSD = fF.reduce((s,f)=>s+montoCobradoUSD(f),0);
  const totalCobradoBS = fF.reduce((s,f)=>s+montoCobradoBS(f),0);
  const pendientes = state.facturas.filter(f=>f.estado==='Pendiente'||f.estado==='Abonado');
  const totalPendienteUSD = pendientes.reduce((s,f)=>s+saldoFactura(f),0);
  const totalPendienteBS = totalPendienteUSD * state.tasaActual;
  const totalEgresosUSD = eF.reduce((s,e)=>s+e.montoUSD,0);
  const totalEgresosBS = eF.reduce((s,e)=>s+e.montoBS,0);
  return {totalVentasUSD,totalVentasBS,totalCobradoUSD,totalCobradoBS,totalPendienteUSD,totalPendienteBS,totalEgresosUSD,totalEgresosBS};
}

// GANANCIAS
function pad2(n){ return String(n).padStart(2,'0'); }
function dateToStr(d){ return `${d.getFullYear()}-${pad2(d.getMonth()+1)}-${pad2(d.getDate())}`; }
function inicioFinSemana(baseStr){
  const hoy = new Date((baseStr||hoyStr())+'T00:00:00');
  const dow = hoy.getDay();
  const diffLunes = dow===0 ? 6 : dow-1;
  const lunes = new Date(hoy); lunes.setDate(hoy.getDate()-diffLunes);
  const domingo = new Date(lunes); domingo.setDate(lunes.getDate()+6);
  return [dateToStr(lunes), dateToStr(domingo)];
}
function inicioFinMes(baseStr){
  const hoy = new Date((baseStr||hoyStr())+'T00:00:00');
  const inicio = `${hoy.getFullYear()}-${pad2(hoy.getMonth()+1)}-01`;
  const finDate = new Date(hoy.getFullYear(), hoy.getMonth()+1, 0);
  return [inicio, dateToStr(finDate)];
}
function statsRango(fechaInicio, fechaFin){
  const enRango = f => f>=fechaInicio && f<=fechaFin;
  const fRango = state.facturas.filter(f=>enRango(f.fecha));
  const eRango = state.egresos.filter(e=>enRango(e.fecha));
  const cobradas = fRango.filter(f=>f.estado==='Cancelado');
  const conAlgunPago = fRango.filter(f=>(f.montoAbonadoUSD||0)>0);
  const totalCobradoUSD = fRango.reduce((s,f)=>s+montoCobradoUSD(f),0);
  const totalCobradoBS = fRango.reduce((s,f)=>s+montoCobradoBS(f),0);
  const totalFacturadoUSD = fRango.reduce((s,f)=>s+f.totalUSD,0);
  const totalFacturadoBS = fRango.reduce((s,f)=>s+f.totalBS,0);
  const totalEgresosUSD = eRango.reduce((s,e)=>s+e.montoUSD,0);
  const totalEgresosBS = eRango.reduce((s,e)=>s+e.montoBS,0);
  return {
    totalCobradoUSD, totalCobradoBS, totalFacturadoUSD, totalFacturadoBS,
    totalEgresosUSD, totalEgresosBS,
    netoUSD: totalCobradoUSD-totalEgresosUSD, netoBS: totalCobradoBS-totalEgresosBS,
    nFacturas: fRango.length, nCobradas: conAlgunPago.length, nCompletas: cobradas.length
  };
}
function bloqueReporte(titulo, sub, s){
  return `
    <div class="card">
      <h2>${titulo}</h2>
      <div class="sub" style="margin:-8px 0 14px;font-size:11.5px;color:var(--gris);">${sub} &middot; ${s.nCobradas} con pago registrado (${s.nCompletas} completa${s.nCompletas!==1?'s':''}) de ${s.nFacturas} emitida(s)</div>
      <div class="kpi-grid">
        <div class="kpi verde"><div class="t">Cobrado</div><div class="v">${fmtUSD(s.totalCobradoUSD)}</div><div class="v2">${fmtBs(s.totalCobradoBS)}</div></div>
        <div class="kpi rojo"><div class="t">Egresos</div><div class="v">${fmtUSD(s.totalEgresosUSD)}</div><div class="v2">${fmtBs(s.totalEgresosBS)}</div></div>
        <div class="kpi"><div class="t">Ganancia Neta</div><div class="v">${fmtUSD(s.netoUSD)}</div><div class="v2">${fmtBs(s.netoBS)}</div></div>
        <div class="kpi amar"><div class="t">Facturado Total</div><div class="v">${fmtUSD(s.totalFacturadoUSD)}</div><div class="v2">${fmtBs(s.totalFacturadoBS)}</div></div>
      </div>
    </div>

function renderReportes(){
  const hoy = hoyStr();
  const [lunes, domingo] = inicioFinSemana(hoy);
  const mesSeleccionado = state.filtroMesGanancias || hoy.substring(0,7); // 'YYYY-MM'

  <div class="card" style="padding-bottom:10px;">

function agregarItemAlCarrito(){
  const esOtro = document.getElementById('chkOtroServicio').checked;
  const cant = parseFloat(document.getElementById('vCantidad').value) || 0;
  const precioU = parseFloat(document.getElementById('vPrecioUnitarioUSD').value) || 0;
  if(cant<=0){ alert('La cantidad debe ser mayor a 0.'); return; }

  if(esOtro){
    // Servicio "Otros": no depende del catálogo, se escribe la descripción y el precio a mano.
    const desc = document.getElementById('vOtroDescripcion').value.trim();
    if(!desc){ alert('Escribe la descripción del servicio.'); return; }
    if(precioU<=0){ alert('Ingresa el precio de este servicio.'); return; }
    // Se fusiona con un "Otro" anterior solo si tiene EXACTAMENTE la misma descripción y precio.
    const existenteOtro = carritoActual.find(it=>it.productoId===null && it.nombre.toLowerCase()===desc.toLowerCase() && Math.abs(it.precioUnitarioUSD-precioU)<0.0001);
    if(existenteOtro){
      existenteOtro.cantidad += cant;
      existenteOtro.subtotalUSD = existenteOtro.cantidad*existenteOtro.precioUnitarioUSD;
    } else {
      carritoActual.push({productoId:null, nombre:desc, cantidad:cant, precioUnitarioUSD:precioU, subtotalUSD:cant*precioU});
    }
    document.getElementById('vOtroDescripcion').value = '';
    document.getElementById('vCantidad').value = 1; document.getElementById('vPrecioUnitarioUSD').value = '';
    document.getElementById('lblSubtotalItemUSD').textContent = '0.00'; document.getElementById('lblSubtotalItemBS').textContent = '0.00';
    renderCarritoTabla(); renderTotalesFactura();
    document.getElementById('vOtroDescripcion').focus();
    return;
  }

  const input = document.getElementById('vProductoInput');
  const hidden = document.getElementById('vProductoIdSel');
  let idSel = hidden.value;
  if(!idSel && input.value.trim()){
    const match = state.catalogo.find(p=>p.nombre.toLowerCase()===input.value.trim().toLowerCase());
    if(match) idSel = match.id;
  }
  if(!idSel){ alert('Selecciona un producto válido.'); return; }
  const prod = state.catalogo.find(p=>p.id==idSel);
  // Si el mismo producto (al mismo precio unitario) ya está en la factura, se suma la cantidad
  // en vez de crear una fila repetida con la misma descripción.
  const existente = carritoActual.find(it=>it.productoId==prod.id && Math.abs(it.precioUnitarioUSD-precioU)<0.0001);
  if(existente){
    existente.cantidad += cant;
    existente.subtotalUSD = existente.cantidad*existente.precioUnitarioUSD;
  } else {
    carritoActual.push({productoId:prod.id, nombre:prod.nombre, cantidad:cant, precioUnitarioUSD:precioU, subtotalUSD:cant*precioU});
  }
  input.value = ''; hidden.value = ''; document.getElementById('vCantidad').value = 1; document.getElementById('vPrecioUnitarioUSD').value = '';
  document.getElementById('lblSubtotalItemUSD').textContent = '0.00'; document.getElementById('lblSubtotalItemBS').textContent = '0.00';
  renderCarritoTabla(); renderTotalesFactura();
  input.focus();
}
function renderCarritoTabla(){
  const tbody = document.getElementById('tablaCarrito');
  if(!tbody) return;
  tbody.innerHTML = carritoActual.length ? carritoActual.map((it,i)=>`
    <tr class="${i===carritoActual.length-1?'destacado':''}"><td>${it.nombre}</td><td>$${it.precioUnitarioUSD.toFixed(2)}</td>
    <td><input type="number" min="1" step="1" value="${it.cantidad}" style="width:58px;padding:5px 6px;border:1px solid var(--borde);border-radius:8px;font-size:13px;" onchange="cambiarCantidadCarrito(${i},this.value)"></td>

    <td class="row-actions"><button class="del" onclick="quitarItemCarrito(${i})">&#10005;</button></td></tr>

    <div class="empty-cart-ic">&#10024;<span>&#128230;</span>&#10024;</div>
    <b>Tu factura está vacía</b><span>Agrega productos o servicios para comenzar</span>
  </div></td></tr>`;
}
function renderTotalesFactura(){
  const totalUSD = carritoActual.reduce((s,it)=>s+it.subtotalUSD,0);
  const cantItems = carritoActual.reduce((s,it)=>s+Number(it.cantidad),0);
  const elU = document.getElementById('lblTotalFacturaUSD'), elB = document.getElementById('lblTotalFacturaBS'), elC = document.getElementById('lblTotalCantItems');
  if(elU) elU.textContent = fmtUSD(totalUSD);
  if(elB) elB.textContent = fmtBs(totalUSD*state.tasaActual);
  if(elC) elC.textContent = cantItems;
}
function quitarItemCarrito(i){ carritoActual.splice(i,1); renderCarritoTabla(); renderTotalesFactura(); }
function cambiarCantidadCarrito(i, valor){
  const cant = parseFloat(valor)||0;
  if(cant<=0){ quitarItemCarrito(i); return; }
  carritoActual[i].cantidad = cant;
  carritoActual[i].subtotalUSD = cant*carritoActual[i].precioUnitarioUSD;
  renderCarritoTabla(); renderTotalesFactura();
}
function vaciarCarrito(){ carritoActual=[]; renderCarritoTabla(); renderTotalesFactura(); }
function procesarFactura(){
  const cliente = document.getElementById('vCliente').value.trim();
  const estadoPago = document.getElementById('vEstadoPago').value;
  const observacion = document.getElementById('vObservacion') ? document.getElementById('vObservacion').value.trim() : '';
  const fecha = state.filtroFecha || hoyStr();
  if(!cliente){ alert('Por favor ingresa el nombre del cliente.'); return; }
  if(carritoActual.length===0){ alert('La factura está vacía.'); return; }
  const totalUSD = carritoActual.reduce((s,it)=>s+it.subtotalUSD,0);

  let montoAbonadoUSD = 0;
  let abonos = [];
  let estadoFinal = estadoPago;
  if(estadoPago==='Abonado'){
    const montoInput = parseFloat(document.getElementById('vMontoAbonado').value) || 0;
    if(montoInput<=0){ alert('Ingresa cuánto abona el cliente ahora.'); return; }
    if(montoInput >= totalUSD - 0.0001){
      // Si abona el total, en realidad la factura queda Cancelada.
      montoAbonadoUSD = totalUSD; estadoFinal = 'Cancelado';
    } else {
      montoAbonadoUSD = montoInput; estadoFinal = 'Abonado';
      abonos = [{fecha, montoUSD: montoInput, tasaHistorica: state.tasaActual, montoBS: montoInput*state.tasaActual}];
    }
  } else if(estadoPago==='Cancelado'){
    montoAbonadoUSD = totalUSD;
  }

  const nuevaFactura = {
    id: uid(), numeroFactura: 'FAC-'+String(state.contadorFactura).padStart(4,'0'),
    fecha, cliente, items:[...carritoActual], totalUSD,
    tasaHistorica: state.tasaActual, totalBS: totalUSD*state.tasaActual, estado: estadoFinal,
    montoAbonadoUSD, abonos,
    observacion: observacion || ''
  };
  state.contadorFactura++;
  state.facturas.push(nuevaFactura);
  guardarOActualizarClienteDesdeFactura(cliente);
  facturaClienteTmp = '';
  vaciarCarrito();
  saveState();
  goTo(estadoFinal!=='Cancelado' ? 'deudores' : 'historial');
  generarReciboCliente(nuevaFactura.id);
}

// HISTORIAL DE VENTAS
function facturasHistorialFiltradas(){
  // El Historial es un libro completo: NO se limita al día de "Fecha de Consulta" (eso es
  // solo para el Dashboard). Aquí sí respeta "Filtrar por Mes" si el usuario lo usa.
  let lista = state.filtroMes ? state.facturas.filter(f=>f.fecha.startsWith(state.filtroMes)) : state.facturas.slice();
  const q = (state.filtroTextoHistorial||'').trim().toLowerCase();
  if(q){
    lista = lista.filter(f =>
      f.numeroFactura.toLowerCase().includes(q) ||
      f.cliente.toLowerCase().includes(q) ||
      f.items.some(i=>i.nombre.toLowerCase().includes(q))
    );
  }
  if(state.filtroEstadoHistorial){
    lista = lista.filter(f=>f.estado===state.filtroEstadoHistorial);
  }
  return lista;
}

  const input = document.getElementById('histBuscar');
  input.focus();
  input.setSelectionRange(input.value.length, input.value.length); // cursor al final, no al principio
}
function actualizarEstadoHistorial(){ state.filtroEstadoHistorial = document.getElementById('histEstado').value; render(); }
function limpiarFiltrosHistorial(){ state.filtroTextoHistorial=''; state.filtroEstadoHistorial=''; render(); }

// Agrupa una lista de facturas por cliente, conservando el orden de aparición
// (más reciente primero) para no repetir el nombre en cada renglón.
function agruparFacturasPorCliente(lista){
  const orden = [];
  const mapa = {};
  lista.forEach(f=>{
    const key = normalizarNombre(f.cliente);
    if(!mapa[key]){ mapa[key] = { cliente: f.cliente, facturas: [] }; orden.push(key); }
    mapa[key].facturas.push(f);
  });
  return orden.map(k=>mapa[k]);
}

function renderHistorial(){
  const lista = facturasHistorialFiltradas();
  const grupos = agruparFacturasPorCliente([...lista].reverse());
  return `
  <div class="pagehead"><div><h1>Historial de Facturas</h1></div></div>
  <div class="card" style="padding-bottom:14px;">
    <div style="display:flex;gap:12px;flex-wrap:wrap;align-items:end;">
      <div class="field" style="flex:2;min-width:200px;margin-bottom:0;"><label>Buscar (N° factura, cliente o producto)</label>
        <input type="text" id="histBuscar" placeholder="Ej: Rosa, FAC-0032, tesis..." value="${state.filtroTextoHistorial||''}" oninput="actualizarBusquedaHistorial()"></div>
      <div class="field" style="flex:1;min-width:150px;margin-bottom:0;"><label>Estado</label>
        <select id="histEstado" onchange="actualizarEstadoHistorial()">
          <option value="">Todos</option>
          <option value="Cancelado" ${state.filtroEstadoHistorial==='Cancelado'?'selected':''}>Cancelado</option>
          <option value="Pendiente" ${state.filtroEstadoHistorial==='Pendiente'?'selected':''}>Pendiente</option>
          <option value="Abonado" ${state.filtroEstadoHistorial==='Abonado'?'selected':''}>Abonado</option>
        </select></div>
      <button class="btn btn-outline btn-sm" onclick="limpiarFiltrosHistorial()">Limpiar</button>
    </div>
    <div class="notice" style="margin:12px 0 0;">&#8505;&#65039; El Historial muestra todas las fechas (no depende de "Fecha de Consulta" de arriba). Usa "Filtrar por Mes" o el buscador si quieres acotarlo.</div>
  </div>
  <div class="card"><div class="table-wrap"><table>
    <thead><tr><th>Cliente</th><th>N° Factura</th><th>Fecha</th><th>Detalle</th><th>Total ($)</th><th>Tasa</th><th>Total (Bs)</th><th>Estado</th><th></th></tr></thead>
    <tbody>
    ${grupos.length? grupos.map(g=>
      g.facturas.map((f,idx)=>{
        const resumen = f.items.map(i=>`${i.cantidad}x ${i.nombre}`).join(', ');
        const celdaCliente = idx===0
          ? `<td rowspan="${g.facturas.length}" style="vertical-align:top;border-right:2px solid var(--verde-claro);background:rgba(76,175,132,.04);"><b>${g.cliente}</b>${g.facturas.length>1?`<br><small style="color:var(--gris);">${g.facturas.length} facturas</small>`:''}</td>`
          : '';
        return `<tr>${celdaCliente}<td><b>${f.numeroFactura}</b></td><td>${f.fecha}</td><td><small>${resumen}</small></td>
        <td><b>${fmtUSD(f.totalUSD)}</b></td><td>${f.tasaHistorica.toFixed(2)}</td><td>${fmtBs(f.totalBS)}</td><td>${badgeEstado(f.estado)}</td>
        <td class="row-actions"><button onclick="verDetalleFactura(${f.id})">&#128065;</button><button onclick="editarFactura(${f.id})">&#9998;</button><button onclick="generarReciboCliente(${f.id})">&#129534;</button><button title="Descargar Factura PDF" onclick="generarFacturaPDF(${f.id})">&#128196;</button><button class="del" onclick="eliminarFactura(${f.id})">&#128465;</button></td></tr>`;
      }).join('')
    ).join('') : `<tr><td colspan="9" class="empty">No se encontraron facturas con esos filtros.</td></tr>`}
    </tbody>
  </table></div></div>
  `;
}
function verDetalleFactura(id){
  const f = state.facturas.find(x=>x.id==id);
  if(!f) return;
  openModal(`Factura ${f.numeroFactura} - ${f.cliente}`, `
    <div style="font-size:13px;margin-bottom:10px;">
      <b>Fecha:</b> ${f.fecha} &nbsp;|&nbsp; <b>Estado:</b> ${badgeEstado(f.estado)}<br>
      <b>Tasa aplicada:</b> ${f.tasaHistorica.toFixed(2)} Bs/$
    </div>
    <div class="table-wrap"><table>
      <thead><tr><th>Producto</th><th>Cant.</th><th>P. Unit ($)</th><th>Subtotal ($)</th></tr></thead>
      <tbody>${f.items.map(i=>`<tr><td>${i.nombre}</td><td>${i.cantidad}</td><td>$${i.precioUnitarioUSD.toFixed(2)}</td><td>$${i.subtotalUSD.toFixed(2)}</td></tr>`).join('')}</tbody>
    </table></div>
    <div class="totales-box" style="margin-top:12px;">
      <div class="row"><span>TOTAL ($):</span><span><b>${fmtUSD(f.totalUSD)}</b></span></div>
      <div class="row"><span>TOTAL CONGELADO (Bs):</span><span><b>${fmtBs(f.totalBS)}</b></span></div>
      ${(f.montoAbonadoUSD>0) ? `<div class="row"><span>ABONADO:</span><span>${fmtUSD(f.montoAbonadoUSD)}</span></div>
      <div class="row"><span>SALDO PENDIENTE:</span><span><b>${fmtUSD(saldoFactura(f))}</b></span></div>` : ''}
    </div>
    ${(f.abonos && f.abonos.length) ? `
    <div style="margin-top:14px;">
      <div style="font-size:12.5px;font-weight:700;color:var(--gris-txt);margin-bottom:6px;">Abonos registrados</div>
      <div class="table-wrap" style="max-height:160px;"><table>
        <thead><tr><th>Fecha</th><th>Monto ($)</th><th>Tasa ese día</th></tr></thead>
        <tbody>${f.abonos.map(a=>`<tr><td>${a.fecha}</td><td>${fmtUSD(a.montoUSD)}</td><td>${a.tasaHistorica.toFixed(2)}</td></tr>`).join('')}</tbody>
      </table></div>
    </div>` : ''}
    <div style="margin-top:14px;">
      <button class="btn btn-primary btn-block" onclick="generarFacturaPDF(${f.id})">&#128196; Descargar Factura (PDF)</button>
    </div>
  `);
}

// FACTURA EN PDF (documento completo para el cliente)
function generarFacturaPDF(id){
  const f = state.facturas.find(x=>x.id==id);
  if(!f) return;
  if(!window.jspdf || !window.jspdf.jsPDF){
    alert('No se pudo cargar el generador de PDF. Verifica tu conexión a internet e intenta de nuevo.');
    return;
  }
  const cliente = buscarClientePorNombre(f.cliente) || {};
  const { jsPDF } = window.jspdf;
  const doc = new jsPDF({ unit: 'mm', format: 'a4' });
  const pageW = doc.internal.pageSize.getWidth();
  const pageH = doc.internal.pageSize.getHeight();
  const margenIzq = 14, margenDer = pageW - 14;

  // --- Logo del negocio (arriba a la izquierda) ---
  let xTexto = margenIzq;
  if(LOGO_NEGOCIO_DATAURI){
    try{
      const logoW = 30, logoH = logoW * (254/500);
      doc.addImage(LOGO_NEGOCIO_DATAURI, 'PNG', margenIzq, 10, logoW, logoH);
      xTexto = margenIzq + logoW + 5;
    }catch(e){ console.error('No se pudo insertar el logo en el PDF', e); }
  }

  // --- Encabezado: datos del negocio (izquierda, junto al logo) ---
  let y = 18;
  doc.setFont('helvetica', 'bold'); doc.setFontSize(16); doc.setTextColor(25, 25, 79);
  doc.text(state.negocioNombre || 'Sistema Comercial', xTexto, y);
  doc.setFont('helvetica', 'normal'); doc.setFontSize(9); doc.setTextColor(90, 90, 90);
  y += 6;
  if(state.negocioRif){ doc.text('RIF: ' + state.negocioRif, xTexto, y); y += 4.5; }
  if(state.negocioDireccion){ const dl2 = doc.splitTextToSize(state.negocioDireccion, 85); doc.text(dl2, xTexto, y); y += 4.5 * dl2.length; }
  if(state.negocioTelefono){ doc.text('Tel: ' + state.negocioTelefono, xTexto, y); y += 4.5; }
  if(state.negocioEmail){ doc.text(state.negocioEmail, xTexto, y); y += 4.5; }
  const yNegocioFin = Math.max(y, 10 + 30*(254/500) + 4);

  // --- Encabezado: datos del documento (derecha) ---
  doc.setFont('helvetica', 'bold'); doc.setFontSize(15); doc.setTextColor(135, 60, 168);
  doc.text('FACTURA', margenDer, 18, { align: 'right' });
  doc.setFontSize(11); doc.setTextColor(40, 40, 40);
  doc.text(f.numeroFactura, margenDer, 25, { align: 'right' });
  doc.setFont('helvetica', 'normal'); doc.setFontSize(9); doc.setTextColor(90, 90, 90);
  doc.text('Fecha de emisión: ' + fmtDatePretty(f.fecha), margenDer, 31, { align: 'right' });
  doc.text('Estado: ' + f.estado, margenDer, 36, { align: 'right' });

  y = Math.max(yNegocioFin, 40) + 5;
  doc.setDrawColor(230, 221, 240); doc.setLineWidth(0.4);
  doc.line(margenIzq, y, margenDer, y);
  y += 8;

  // --- Datos del cliente ---
  doc.setFont('helvetica', 'bold'); doc.setFontSize(10); doc.setTextColor(25, 25, 79);
  doc.text('Facturar a:', margenIzq, y); y += 5.5;
  doc.setFont('helvetica', 'normal'); doc.setFontSize(9.5); doc.setTextColor(40, 40, 40);
  doc.text(f.cliente || '—', margenIzq, y); y += 4.5;
  if(cliente.rif){ doc.text('RIF/Cédula: ' + cliente.rif, margenIzq, y); y += 4.5; }
  if(cliente.direccion){ const dl = doc.splitTextToSize(cliente.direccion, 120); doc.text(dl, margenIzq, y); y += 4.5 * dl.length; }
  if(cliente.telefono){ doc.text('Tel: ' + cliente.telefono, margenIzq, y); y += 4.5; }
  if(cliente.correo){ doc.text(cliente.correo, margenIzq, y); y += 4.5; }
  y += 4;

  // --- Tabla de productos/servicios ---
  const filas = f.items.map(it => [it.nombre, String(it.cantidad), '$' + it.precioUnitarioUSD.toFixed(2), '$' + it.subtotalUSD.toFixed(2)]);
  doc.autoTable({
    startY: y,
    head: [['Producto / Servicio', 'Cant.', 'P. Unitario', 'Subtotal']],
    body: filas,
    theme: 'grid',
    headStyles: { fillColor: [135, 60, 168], textColor: 255, fontStyle: 'bold', fontSize: 9.5 },
    styles: { fontSize: 9.5, cellPadding: 3, textColor: [50,50,50] },
    columnStyles: { 1: { halign: 'center', cellWidth: 20 }, 2: { halign: 'right', cellWidth: 35 }, 3: { halign: 'right', cellWidth: 35 } },
    margin: { left: margenIzq, right: 14 }
  });

  let fy = doc.lastAutoTable.finalY + 8;

  // --- Totales ---
  doc.setFont('helvetica', 'normal'); doc.setFontSize(9.5); doc.setTextColor(70, 70, 70);
  doc.text('Total en bolívares (tasa ' + f.tasaHistorica.toFixed(2) + ' Bs/$):', margenDer - 55, fy, { align: 'right' });
  doc.text(fmtBs(f.totalBS), margenDer, fy, { align: 'right' });
  fy += 7;
  doc.setDrawColor(230, 221, 240); doc.line(margenDer - 75, fy - 4.5, margenDer, fy - 4.5);
  doc.setFont('helvetica', 'bold'); doc.setFontSize(13); doc.setTextColor(25, 25, 79);
  doc.text('TOTAL:', margenDer - 55, fy, { align: 'right' });
  doc.text(fmtUSD(f.totalUSD), margenDer, fy, { align: 'right' });
  fy += 8;

  if(f.montoAbonadoUSD > 0){
    doc.setFont('helvetica', 'normal'); doc.setFontSize(9.5); doc.setTextColor(80, 80, 80);
    doc.text('Abonado:', margenDer - 55, fy, { align: 'right' });
    doc.text(fmtUSD(f.montoAbonadoUSD), margenDer, fy, { align: 'right' });
    fy += 6;
    doc.setFont('helvetica', 'bold'); doc.setTextColor(177, 81, 107);
    doc.text('Saldo pendiente:', margenDer - 55, fy, { align: 'right' });
    doc.text(fmtUSD(saldoFactura(f)), margenDer, fy, { align: 'right' });
    fy += 8;
  }

  // --- Detalle de abonos, si los hay ---
  if(f.abonos && f.abonos.length){
    doc.setFont('helvetica', 'bold'); doc.setFontSize(9.5); doc.setTextColor(25, 25, 79);
    doc.text('Abonos registrados', margenIzq, fy); fy += 2;
    doc.autoTable({
      startY: fy,
      head: [['Fecha', 'Monto ($)', 'Tasa ese día']],
      body: f.abonos.map(a => [a.fecha, '$' + a.montoUSD.toFixed(2), a.tasaHistorica.toFixed(2) + ' Bs/$']),
      theme: 'plain',
      styles: { fontSize: 8.5, cellPadding: 2, textColor: [80,80,80] },
      headStyles: { fontStyle: 'bold', textColor: [90,90,90] },
      margin: { left: margenIzq, right: 14 }
    });
    fy = doc.lastAutoTable.finalY + 6;
  }

  // --- Pie de página ---
  doc.setFont('helvetica', 'italic'); doc.setFontSize(8); doc.setTextColor(150, 150, 150);
  doc.text('Documento generado electrónicamente — ' + (state.negocioNombre || 'Sistema Comercial'), margenIzq, pageH - 12);

  doc.save(f.numeroFactura + ' - ' + (f.cliente || 'cliente') + '.pdf');
}

// EDICIÓN FACTURA
let facturaEditId = null;
let facturaEditItems = [];
function editarFactura(id){
  const f = state.facturas.find(x=>x.id==id);
  if(!f) return;
  facturaEditId = id;
  facturaEditItems = JSON.parse(JSON.stringify(f.items));
  openModal(`&#9998; Editar Factura ${f.numeroFactura}`, `
    <div class="field"><label>Cliente</label><input type="text" id="efCliente" value="${(f.cliente||'').replace(/"/g,'&quot;')}"></div>
    <div style="display:flex;gap:10px;">
      <div class="field" style="flex:1;"><label>Fecha</label><input type="date" id="efFecha" value="${f.fecha}"></div>
      <div class="field" style="flex:1;"><label>Estado</label>
        <select id="efEstado">
          <option value="Cancelado" ${f.estado==='Cancelado'?'selected':''}>Cancelado</option>
          <option value="Pendiente" ${f.estado==='Pendiente'?'selected':''}>Pendiente</option>
          <option value="Abonado" ${f.estado==='Abonado'?'selected':''}>Abonado (parcial)</option>
        </select></div>
      <div class="field" style="flex:1;"><label>Tasa Bs/$</label><input type="number" step="0.01" id="efTasa" value="${f.tasaHistorica.toFixed(2)}" oninput="renderTablaEdicionItems()"></div>
    </div>
    <div class="table-wrap" style="max-height:200px;"><table>
      <thead><tr><th>Producto</th><th>P. Unit ($)</th><th>Cant.</th><th>Subtotal ($)</th><th></th></tr></thead>
      <tbody id="tablaEdicionItems"></tbody>
    </table></div>
    <div class="totales-box" style="margin-top:10px;">
      <div class="row"><span>Nuevo total:</span><span><b id="efTotalUSD">${fmtUSD(f.totalUSD)}</b></span></div>
      <div class="row"><span>Equivalente Bs:</span><span id="efTotalBS">${fmtBs(f.totalBS)}</span></div>
    </div>
    <div class="modal-actions" style="margin-top:16px;">
      <button class="btn btn-primary" onclick="guardarEdicionFactura()">Guardar Cambios</button>
    </div>
  `);
  renderTablaEdicionItems();
}
function renderTablaEdicionItems(){
  const tbody = document.getElementById('tablaEdicionItems');
  if(!tbody) return;
  tbody.innerHTML = facturaEditItems.map((it,i)=>`
    <tr><td>${it.nombre}</td><td>$${it.precioUnitarioUSD.toFixed(2)}</td><td>${it.cantidad}</td><td>$${it.subtotalUSD.toFixed(2)}</td>
    <td class="row-actions"><button class="del" onclick="facturaEditItems.splice(${i},1);renderTablaEdicionItems();">&#10005;</button></td></tr>
  `).join('');
  // Recalcula el total en vivo cada vez que se borra un ítem o cambia la tasa, para que nunca quede desfasado.
  const totalUSD = facturaEditItems.reduce((s,it)=>s+it.subtotalUSD,0);
  const tasa = parseFloat(document.getElementById('efTasa')?.value) || 0;
  const elU = document.getElementById('efTotalUSD'), elB = document.getElementById('efTotalBS');
  if(elU) elU.textContent = fmtUSD(totalUSD);
  if(elB) elB.textContent = fmtBs(totalUSD*tasa);
}
function guardarEdicionFactura(){
  const i = state.facturas.findIndex(f=>f.id==facturaEditId);
  if(i===-1) return;
  const cliente = document.getElementById('efCliente').value.trim();
  const fecha = document.getElementById('efFecha').value;
  const estado = document.getElementById('efEstado').value;
  const tasa = parseFloat(document.getElementById('efTasa').value) || 0;
  if(!cliente || !fecha){ alert('Completa los campos obligatorios.'); return; }
  if(facturaEditItems.length===0){ alert('La factura debe tener al menos un ítem. Si quieres eliminarla por completo, usa el botón de borrar en el historial.'); return; }

  // Recalcula el total real a partir de los ítems que quedaron (antes se guardaba el total viejo sin tocar).
  const nuevoTotalUSD = facturaEditItems.reduce((s,it)=>s+it.subtotalUSD,0);
  let montoAbonadoUSD = state.facturas[i].montoAbonadoUSD || 0;
  let estadoFinal = estado;

  if(estado==='Cancelado'){
    montoAbonadoUSD = nuevoTotalUSD;
  } else if(estado==='Pendiente'){
    montoAbonadoUSD = 0;
  } else if(estado==='Abonado'){
    // Si el total bajó por debajo de lo ya abonado, no puede deber "negativo": se ajusta al nuevo total.
    montoAbonadoUSD = Math.min(montoAbonadoUSD, nuevoTotalUSD);
    if(montoAbonadoUSD >= nuevoTotalUSD - 0.0001){ estadoFinal = 'Cancelado'; montoAbonadoUSD = nuevoTotalUSD; }
  }

  state.facturas[i] = {
    ...state.facturas[i], cliente, fecha, estado: estadoFinal, items: [...facturaEditItems],
    totalUSD: nuevoTotalUSD, tasaHistorica: tasa, totalBS: nuevoTotalUSD * tasa, montoAbonadoUSD
  };
  closeModal(); saveState(); render();
}

// CLIENTES
let clienteEditId = null;

function normalizarNombre(n){ return (n||'').trim().toLowerCase(); }
// Escapa un texto para insertarlo de forma segura dentro de un onclick="...('texto')" —
// sin esto, un nombre con comillas dobles rompe el botón (bug real detectado y corregido).
function escAttr(s){
  return String(s==null?'':s).replace(/\\/g,'\\\\').replace(/'/g,"\\'").replace(/"/g,'&quot;');
}

function buscarClientePorNombre(nombre){
  const n = normalizarNombre(nombre);
  return state.clientes.find(c=>normalizarNombre(c.nombre)===n);
}

// Se llama al procesar una factura: si el nombre no existe como cliente registrado, lo crea automáticamente.
function guardarOActualizarClienteDesdeFactura(nombreCliente){
  if(!buscarClientePorNombre(nombreCliente)){
    state.clientes.push({id: uid(), nombre: nombreCliente, telefono: '', rif: '', direccion: '', correo: '', notas: ''});
  }
}

function deudaClienteUSD(nombre){
  const n = normalizarNombre(nombre);
  return state.facturas.filter(f=>(f.estado==='Pendiente'||f.estado==='Abonado') && normalizarNombre(f.cliente)===n).reduce((s,f)=>s+saldoFactura(f),0);
}

function totalCompradoClienteUSD(nombre){
  const n = normalizarNombre(nombre);
  return state.facturas.filter(f=>normalizarNombre(f.cliente)===n).reduce((s,f)=>s+f.totalUSD,0);
}

function renderClientes(){
  return `
  <div class="pagehead"><div><h1>&#128100; Clientes</h1><div class="sub">Datos de contacto y resumen de compras / deuda por cliente</div></div></div>

      <div style="display:flex;gap:10px;">

        <div class="field" style="flex:1;"><label>RIF / Cédula</label><input type="text" id="clRif" placeholder="V-12345678"></div>
      </div>

      <button class="btn btn-primary" onclick="guardarCliente()">Guardar Cliente</button>
      ${clienteEditId ? `<button class="btn btn-outline" style="margin-left:8px;" onclick="clienteEditId=null;render();">Cancelar edición</button>` : ''}
    </div>
    <div class="card">
      <h2>Listado de Clientes</h2>
      <div class="table-wrap"><table>
        <thead><tr><th>Nombre</th><th>Teléfono</th><th>RIF/Cédula</th><th>Comprado Total ($)</th><th>Deuda Pendiente ($)</th><th></th></tr></thead>
        <tbody>
          ${state.clientes.length ? state.clientes.map(c=>{
            const deuda = deudaClienteUSD(c.nombre);
            return `<tr><td><b>${c.nombre}</b></td><td>${c.telefono||'—'}</td><td>${c.rif||'—'}</td><td>${fmtUSD(totalCompradoClienteUSD(c.nombre))}</td>
            <td>${deuda>0? `<span class="badge rojo">${fmtUSD(deuda)}</span>` : '—'}</td>
            <td class="row-actions">${c.telefono? `<button title="WhatsApp" onclick="contactarClienteWhatsApp('${escAttr(c.nombre)}')">&#128241;</button>`:''}<button onclick="prepararEdicionCliente(${c.id})">&#9998;</button><button class="del" onclick="eliminarCliente(${c.id})">&#128465;</button></td></tr>`;
          }).join('') : `<tr><td colspan="6" class="empty">Aún no tienes clientes registrados. Se crean automáticamente al facturar, o agrégalos aquí.</td></tr>`}
        </tbody>
      </table></div>
    </div>

function guardarCliente(){
  const nombre = document.getElementById('clNombre').value.trim();
  const telefono = document.getElementById('clTelefono').value.trim();
  const rif = document.getElementById('clRif').value.trim();
  const direccion = document.getElementById('clDireccion').value.trim();
  const correo = document.getElementById('clCorreo').value.trim();
  const notas = document.getElementById('clNotas').value.trim();
  if(!nombre){ alert('Ingresa el nombre del cliente.'); return; }
  if(clienteEditId){
    const i = state.clientes.findIndex(c=>c.id===clienteEditId);
    if(i!==-1){ state.clientes[i] = {...state.clientes[i], nombre, telefono, rif, direccion, correo, notas}; }
  } else {
    if(buscarClientePorNombre(nombre)){ alert('Ya existe un cliente con ese nombre.'); return; }
    state.clientes.push({id: uid(), nombre, telefono, rif, direccion, correo, notas});
  }
  clienteEditId = null;
  saveState(); render();
}

function prepararEdicionCliente(id){
  const c = state.clientes.find(x=>x.id===id);
  if(!c) return;
  clienteEditId = id; render();
  document.getElementById('clNombre').value = c.nombre;
  document.getElementById('clTelefono').value = c.telefono||'';
  document.getElementById('clRif').value = c.rif||'';
  document.getElementById('clDireccion').value = c.direccion||'';
  document.getElementById('clCorreo').value = c.correo||'';
  document.getElementById('clNotas').value = c.notas||'';
}

function eliminarCliente(id){
  if(confirm('¿Eliminar este cliente? (No borra sus facturas ya emitidas)')){
    registrarBorrado('clientes', id);
    state.clientes = state.clientes.filter(c=>c.id!==id);
    saveState(); render();
  }
}

// WHATSAPP
// Normaliza un teléfono venezolano a formato internacional para wa.me (ej: 0414-1234567 -> 584141234567)
function telefonoWhatsApp(tel){
  let d = (tel||'').replace(/\D/g,'');
  if(!d) return '';
  if(d.startsWith('0')) d = '58'+d.slice(1);
  else if(!d.startsWith('58') && d.length===10) d = '58'+d;
  return d;
}
function abrirWhatsApp(nombreCliente, mensaje){
  const c = buscarClientePorNombre(nombreCliente);
  if(!c || !c.telefono){
    alert(`"${nombreCliente}" no tiene teléfono registrado.\nAgrégalo desde la sección Clientes para poder escribirle por WhatsApp.`);
    return;
  }
  const numero = telefonoWhatsApp(c.telefono);
  if(numero.length<11){ alert('El número de teléfono guardado no parece válido: '+c.telefono); return; }
  window.open('https://wa.me/'+numero+'?text='+encodeURIComponent(mensaje), '_blank');
}
function contactarClienteWhatsApp(nombreCliente){
  abrirWhatsApp(nombreCliente, `Hola ${nombreCliente}, te escribimos desde ${state.negocioNombre}. ¿Cómo estás?`);
}
// Arma el mensaje de recordatorio con el desglose exacto de lo que debe (mismo dato que ve el negocio)
function recordarDeudaWhatsApp(nombreCliente){
  const facturas = facturasPendientesCliente(nombreCliente);
  if(!facturas.length){ alert('Este cliente no tiene deudas pendientes.'); return; }
  const total = facturas.reduce((s,f)=>s+saldoFactura(f),0);
  const msg = `Hola ${nombreCliente}, este es un recordatorio de tu saldo pendiente en ${state.negocioNombre}: $${total.toFixed(2)} (${fmtBs(total*state.tasaActual)}).\n\n¡Gracias!`;

// DEUDORES
function facturasPendientesCliente(nombre){
  const n = normalizarNombre(nombre);
  return state.facturas
    .filter(f=> (f.estado==='Pendiente'||f.estado==='Abonado') && normalizarNombre(f.cliente)===n)
    .sort((a,b)=> a.fecha.localeCompare(b.fecha));
}

// Agrupa TODAS las facturas pendientes/abonadas por cliente, para no repetir
// un renglón por cada crédito que pida la misma persona.
function deudoresAgrupados(){
  const orden = [];
  const mapa = {}; // key normalizada -> nombre "de exhibición" (el primero que se encontró)
  state.facturas
    .filter(f=>f.estado==='Pendiente'||f.estado==='Abonado')
    .forEach(f=>{
      const key = normalizarNombre(f.cliente);
      if(!mapa[key]){ mapa[key] = f.cliente; orden.push(key); }
    });
  return orden.map(key=>{
    const nombre = mapa[key];
    const facturas = facturasPendientesCliente(nombre);
    const totalUSD = facturas.reduce((s,f)=>s+saldoFactura(f),0);
    return { cliente: nombre, facturas, totalUSD, fechaMasAntigua: facturas[0] ? facturas[0].fecha : hoyStr() };
  }).filter(g=>g.totalUSD>0.0001).sort((a,b)=>a.fechaMasAntigua.localeCompare(b.fechaMasAntigua));
}

function renderDeudores(){
  const grupos = deudoresAgrupados();
  return `

      return `<tr><td><span class="badge ${dias>15?'rojo':'amar'}">${dias} d</span></td>

        <button class="btn btn-success btn-sm" onclick="cobrarTodoCliente('${escAttr(g.cliente)}')">&#128176; Cobrar Todo</button>

// Modal de detalle: ver y gestionar cada crédito individual del cliente (abonar / cobrar / recibo)
function abrirGestionDeudaCliente(nombreCliente){
  const facturas = facturasPendientesCliente(nombreCliente);
  if(!facturas.length){ closeModal(); return; }
  const totalUSD = facturas.reduce((s,f)=>s+saldoFactura(f),0);
  openModal(`&#128203; Cuenta por Cobrar — ${nombreCliente}`, `

        <tr><td>${f.fecha}</td><td>${f.numeroFactura}</td><td>${fmtUSD(f.totalUSD)}</td>

        <td class="row-actions">
          <button class="btn btn-outline btn-sm" onclick="pedirAbono(${f.id},'${escAttr(nombreCliente)}')">Abonar</button>
          <button class="btn btn-success btn-sm" onclick="cobrarDeuda(${f.id});abrirGestionDeudaCliente('${escAttr(nombreCliente)}')">Cobrar</button>
          <button class="btn btn-outline btn-sm" onclick="generarReciboCliente(${f.id})">&#129534;</button>

  `);
}

function pedirAbono(facturaId, nombreCliente){
  const f = state.facturas.find(x=>x.id==facturaId);
  if(!f) return;
  const saldo = saldoFactura(f);
  window._abonoCtx = { facturaId, nombreCliente, saldo };
  openModal(`&#128176; Abonar — Factura ${f.numeroFactura}`, `
    <div class="totales-box" style="margin-bottom:14px;"><div class="row"><span>Saldo pendiente:</span><span><b>${fmtUSD(saldo)}</b> (${fmtBs(saldo*state.tasaActual)})</span></div></div>
    <div style="display:flex;gap:10px;">
      <div class="field" style="flex:1;"><label>Abona en $</label><input type="number" step="0.01" id="abMontoUSD" placeholder="0.00" oninput="sincronizarMoneda('abMontoUSD','abMontoBS','usd')"></div>
      <div class="field" style="flex:1;"><label>o en Bs (tasa hoy: ${state.tasaActual.toFixed(2)})</label><input type="number" step="0.01" id="abMontoBS" placeholder="0.00" oninput="sincronizarMoneda('abMontoUSD','abMontoBS','bs')"></div>
    </div>
    <button class="btn btn-primary btn-block" style="margin-top:14px;" onclick="confirmarAbono()">Registrar Abono</button>
  `);
}
function confirmarAbono(){
  const ctx = window._abonoCtx;
  if(!ctx) return;
  const monto = parseFloat(document.getElementById('abMontoUSD').value) || 0;
  if(monto<=0){ alert('Ingresa un monto válido.'); return; }
  if(monto > ctx.saldo + 0.0001){ alert('El abono no puede ser mayor al saldo pendiente ('+fmtUSD(ctx.saldo)+').'); return; }
  registrarAbono(ctx.facturaId, monto);
  render();
  if(ctx.nombreCliente) abrirGestionDeudaCliente(ctx.nombreCliente);
  else closeModal();
}

function registrarAbono(facturaId, montoUSD){
  const i = state.facturas.findIndex(f=>f.id==facturaId);
  if(i===-1) return;
  const f = state.facturas[i];
  if(!f.abonos) f.abonos = [];
  f.abonos.push({fecha: hoyStr(), montoUSD, tasaHistorica: state.tasaActual, montoBS: montoUSD*state.tasaActual});
  f.montoAbonadoUSD = (f.montoAbonadoUSD||0) + montoUSD;
  if(f.montoAbonadoUSD >= f.totalUSD - 0.0001){
    f.montoAbonadoUSD = f.totalUSD;
    f.estado = 'Cancelado';
  } else {
    f.estado = 'Abonado';
  }
  saveState();
}

function cobrarDeuda(id){
  const i = state.facturas.findIndex(f=>f.id==id);
  if(i===-1) return;
  const saldo = saldoFactura(state.facturas[i]);
  if(confirm(`¿Marcar el saldo restante (${fmtUSD(saldo)}) de ${state.facturas[i].cliente} como PAGADO HOY?`)){
    if(saldo>0.0001) registrarAbono(id, saldo);
    state.facturas[i].estado = 'Cancelado';
    state.facturas[i].montoAbonadoUSD = state.facturas[i].totalUSD;
    state.facturas[i].tasaHistorica = state.tasaActual;
    state.facturas[i].totalBS = state.facturas[i].totalUSD * state.tasaActual;
    saveState(); render();
  }
}

// Cobra de una sola vez TODOS los créditos pendientes de un mismo cliente
function cobrarTodoCliente(nombreCliente){
  const facturas = facturasPendientesCliente(nombreCliente);
  if(!facturas.length) return;
  const total = facturas.reduce((s,f)=>s+saldoFactura(f),0);
  if(!confirm(`¿Marcar TODOS los créditos de ${nombreCliente} (${fmtUSD(total)}) como pagados hoy?`)) return;
  facturas.forEach(f=>{
    const saldo = saldoFactura(f);
    if(saldo>0.0001) registrarAbono(f.id, saldo);
    const idx = state.facturas.findIndex(x=>x.id===f.id);
    if(idx!==-1){
      state.facturas[idx].estado='Cancelado';
      state.facturas[idx].montoAbonadoUSD = state.facturas[idx].totalUSD;
      state.facturas[idx].tasaHistorica = state.tasaActual;
      state.facturas[idx].totalBS = state.facturas[idx].totalUSD * state.tasaActual;
    }
  });
  saveState(); render();
}

// Borra el historial de facturas para empezar a usar el sistema "en serio" desde FAC-0001.
// Deja intactos catálogo, clientes, egresos y configuración.
function reiniciarFacturacion(){
  const total = state.facturas.length;
  if(total===0){ alert('Ya no hay facturas registradas — el contador ya está listo para empezar.'); return; }
  if(!confirm(`Esto borrará las ${total} factura(s) que existen ahora mismo y reiniciará la numeración desde FAC-0001.\n\nEl catálogo, los clientes, los egresos y la configuración NO se tocan.\n\n¿Continuar?`)) return;
  const confirmacion = prompt('Para confirmar, escribe BORRAR (en mayúsculas) y presiona Aceptar:');
  if(confirmacion !== 'BORRAR'){ alert('Cancelado — no se borró nada.'); return; }
  state.facturas.forEach(f=>registrarBorrado('facturas', f.id));
  state.facturas = [];
  state.contadorFactura = 1;
  saveState(); render();
  alert('Listo. Las facturas se borraron y la próxima que hagas será FAC-0001.');
}
function guardarDatosNegocio(){
  state.negocioIcono = document.getElementById('cfgIcono').value.trim() || '🍃';
  state.negocioNombre = document.getElementById('cfgNombre').value.trim() || 'Sistema Comercial';
  state.negocioRif = document.getElementById('cfgRif').value.trim();
  state.negocioTelefono = document.getElementById('cfgTelefono').value.trim();
  state.negocioDireccion = document.getElementById('cfgDireccion').value.trim();
  state.negocioEmail = document.getElementById('cfgEmail').value.trim();
  saveState(); actualizarMarca(); alert('Datos guardados.');
}
function descargarRespaldo(){
  const blob = new Blob([JSON.stringify(state, null, 2)], {type:'application/json'});
  const url = URL.createObjectURL(blob);
  const a = document.createElement('a'); a.href = url; a.download = `respaldo-${hoyStr()}.json`;
  a.click(); URL.revokeObjectURL(url);
}

<script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf-autotable/3.8.2/jspdf.plugin.autotable.min.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.0/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.0/firebase-firestore-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.0/firebase-auth-compat.js"></script>
<script>
  (function() {
    // Si el navegador bloqueó el script de Firebase (bloqueadores de anuncios/privacidad,
    // sin internet, etc.) el sistema sigue funcionando normal con guardado local (localStorage).
    if (typeof firebase === 'undefined') {
      console.warn('Firebase no se pudo cargar (posiblemente bloqueado por el navegador). El sistema seguirá funcionando solo con almacenamiento local.');
      if (window.setEstadoNube) window.setEstadoNube('local');
      return;
    }
    var firebaseConfig = {
      apiKey: "AIzaSyBwJu1QVe_z2lRU-qXpajlozg5pIaaQdBk",
      authDomain: "facturacion-may.firebaseapp.com",
      projectId: "facturacion-may",
      storageBucket: "facturacion-may.firebasestorage.app",
      messagingSenderId: "206591286218",
      appId: "1:206591286218:web:900d4fa57ce83b34b74d33"
    };

    if (!firebase.apps.length) {
      firebase.initializeApp(firebaseConfig);
    }

    var db = firebase.firestore();
    var docRef = db.collection("sistema").doc("datosGenerales");

    // Si en 8 segundos no hay respuesta de Firebase (ej: sin internet), asumimos modo local.
    setTimeout(function(){ if (estadoNube==='verificando' && window.setEstadoNube) window.setEstadoNube('local'); }, 8000);

    // Inicia sesión de forma anónima e invisible (sin pedir nada a la persona) para que, SI en
    // algún momento activas reglas de seguridad que exijan "usuario autenticado", esto siga
    // funcionando. Si todavía no activaste "Anonymous" en Firebase (o esa parte falla por
    // cualquier motivo), igual se intenta sincronizar sin ella, para no romper nada mientras tanto.
    try {
      firebase.auth().signInAnonymously().then(function(){
        iniciarSincronizacionFirestore();
      }).catch(function(error){
        console.warn("No se pudo iniciar sesión anónima (¿'Anonymous' no está activado en Firebase todavía?). Se sincroniza sin ella:", error);
        iniciarSincronizacionFirestore();
      });
    } catch(error) {
      console.warn("Firebase Auth no disponible. Se sincroniza sin ella:", error);
      iniciarSincronizacionFirestore();
    }

    function iniciarSincronizacionFirestore(){
      // Une dos listas (facturas/clientes/catálogo/egresos) por su "id", sin perder lo que
      // haya agregado CUALQUIERA de los dos dispositivos. Si el mismo id fue editado en ambos
      // lados a la vez, gana la versión de este dispositivo (caso raro; lo común es que cada
      // quien agregue cosas DISTINTAS, y eso sí queda perfectamente combinado).
      // "eliminadosIds" son los ids que se borraron a propósito: se excluyen aunque el otro
      // dispositivo todavía los tenga, para que un borrado no "resucite" al sincronizar.
      function fusionarListasPorId(remota, local, eliminadosIds){
        remota = Array.isArray(remota) ? remota : [];
        local = Array.isArray(local) ? local : [];
        const idsBorrados = new Set(eliminadosIds||[]);
        const mapa = {};
        remota.forEach(function(it){ if(it && it.id!=null) mapa[it.id] = it; });
        local.forEach(function(it){ if(it && it.id!=null) mapa[it.id] = it; });
        idsBorrados.forEach(function(id){ delete mapa[id]; });
        return Object.values(mapa);
      }
      function fusionarEstadoParaNube(remoto, local){
        remoto = remoto || {};
        const eliminadosRemoto = remoto.eliminados || {};
        const eliminadosLocal = local.eliminados || {};
        const resultado = Object.assign({}, remoto, local);
        resultado.eliminados = { facturas: [], clientes: [], catalogo: [], egresos: [] };
        ['facturas','clientes','catalogo','egresos'].forEach(function(campo){
          // Las listas de borrados de ambos dispositivos se combinan, para que un borrado
          // hecho en cualquiera de los dos se respete siempre (y no solo la última vez).
          var idsBorrados = Array.from(new Set([].concat(eliminadosRemoto[campo]||[], eliminadosLocal[campo]||[])));
          resultado.eliminados[campo] = idsBorrados.slice(-1000);
          resultado[campo] = fusionarListasPorId(remoto[campo], local[campo], idsBorrados);
        });
        // El número de factura nunca debe retroceder, para no repetir numeración entre dispositivos.
        resultado.contadorFactura = Math.max(remoto.contadorFactura||1, local.contadorFactura||1);
        return resultado;
      }

      // Sincronización en tiempo real desde Firebase
      docRef.onSnapshot(function(snapshot) {
        if (window.setEstadoNube) window.setEstadoNube('conectado');
        if (snapshot.exists) {
          var data = snapshot.data();
          localStorage.setItem("sistema-facturacion-deudores-v1", JSON.stringify(data));
          if (typeof state !== 'undefined' && typeof seedState === 'function') {
            var overlayEl = document.getElementById('overlay');
            var modalEstabaAbierto = overlayEl && overlayEl.classList.contains('show');
            state = Object.assign(seedState(), data);
            // Revalida el contador de facturas por si llegaron datos más nuevos de otro dispositivo.
            if (typeof asegurarContadorFactura === 'function') asegurarContadorFactura();
            if (modalEstabaAbierto && typeof closeModal === 'function') {
              // Evita guardar sobre datos viejos: si había un formulario abierto (ej. "Abonar"),
              // se cierra en vez de dejarlo con información que la nube acaba de reemplazar.
              closeModal();
            }
            if (typeof render === 'function') render();
          }
        }
      }, function(error) {
        console.error("Error al recibir desde Firebase:", error);
        if (window.setEstadoNube) window.setEstadoNube('error');
      });

      // Función para escribir cambios en Firebase — usa una transacción que primero LEE lo que
      // haya en el servidor y fusiona, en vez de sobrescribirlo a ciegas. Así, si dos
      // dispositivos guardan casi al mismo tiempo, ninguno le borra los datos al otro.
      window.guardarEnNube = function(datos) {
        db.runTransaction(function(transaction){
          return transaction.get(docRef).then(function(doc){
            var remoto = doc.exists ? doc.data() : {};
            var fusionado = fusionarEstadoParaNube(remoto, datos);
            transaction.set(docRef, fusionado);
          });
        }).then(function() {
          console.log("Guardado y fusionado en la nube con éxito");
          if (window.setEstadoNube) window.setEstadoNube('conectado');
        }).catch(function(error) {
          console.error("Error al guardar en la nube:", error);
          if (window.setEstadoNube) window.setEstadoNube('error');
        });
      };
    }
  })();
</script>
