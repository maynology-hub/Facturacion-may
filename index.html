<!-- CONFIGURACIÓN E INTEGRACIÓN CON FIREBASE (MODO COMPATIBLE) -->
<script src="https://www.gstatic.com/firebasejs/10.12.0/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.0/firebase-firestore-compat.js"></script>
<script>
  (function() {
    const firebaseConfig = {
      apiKey: "AIzaSyBwJu1QVe_z2lRU-qXpajlozg5pIaaQdBk",
      authDomain: "facturacion-may.firebaseapp.com",
      projectId: "facturacion-may",
      storageBucket: "facturacion-may.firebasestorage.app",
      messagingSenderId: "206591286218",
      appId: "1:206591286218:web:900d4fa57ce83b34b74d33"
    };

    // Inicializar Firebase
    if (!firebase.apps.length) {
      firebase.initializeApp(firebaseConfig);
    }
    
    const db = firebase.firestore();
    const docRef = db.collection("sistema").doc("datosGenerales");

    // Escuchar cambios en tiempo real desde la nube
    docRef.onSnapshot((snapshot) => {
      if (snapshot.exists) {
        const data = snapshot.data();
        localStorage.setItem("sistema-facturacion-deudores-v1", JSON.stringify(data));
        if (typeof state !== 'undefined' && typeof seedState === 'function') {
          state = Object.assign(seedState(), data);
          if (typeof render === 'function') render();
        }
      }
    }, (error) => {
      console.error("Error en la escucha de Firestore:", error);
    });

    // Función global para guardar en la nube
    window.guardarEnNube = async function(datos) {
      try {
        await docRef.set(datos);
        console.log("Sincronizado con Firebase correctamente");
      } catch (error) {
        console.error("Error al guardar en Firebase:", error);
      }
    };
  })();
</script>
</body>
</html>
