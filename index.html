<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Sistema de Facturación, Deudores y Catálogo</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Quicksand:wght@500;600;700&family=Nunito:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
:root{
  --verde-osc:#2E6B4E;
  --verde:#7DD3AC;
  --verde-fuerte:#4FB98A;
  --verde-claro:#EAF8F1;
  --verde-pastel:#D7F1E3;
  --rosa:#F6C6CD;
  --rosa-claro:#FDF1EE;
  --rosa-fuerte:#EFA3AC;
  --marron:#A9825C;
  --marron-claro:#F1E4D2;
  --crema:#FBF6EA;
  --blanco:#FFFFFF;
  --gris:#A3AC96;
  --gris-txt:#5C6B57;
  --rojo:#E2879A;
  --rojo-bg:#FCE6EB;
  --rojo-txt:#B1516B;
  --amar-bg:#F7ECD6;
  --amar-txt:#8C6A3A;
  --verde-bg:#DEF3E7;
  --verde-txt:#2E6B4E;
  --borde:#E9E2CD;
  --font: 'Nunito', 'Segoe UI', system-ui, -apple-system, Arial, sans-serif;
  --font-title: 'Quicksand', var(--font);
}
*{box-sizing:border-box;}
body{margin:0;font-family:var(--font);background:var(--crema);color:#41504A;}
#app{display:flex;min-height:100vh;}

/* ---------- SIDEBAR ---------- */
.sidebar{
  width:235px;flex-shrink:0;background:linear-gradient(180deg,var(--verde-osc),#1F4F38);
  color:#fff;display:flex;flex-direction:column;position:sticky;top:0;height:100vh;overflow-y:auto;
}
.sidebar .brand{padding:24px 20px 16px;border-bottom:1px solid rgba(255,255,255,.16);}
.sidebar .brand .name{font-family:var(--font-title);font-weight:700;font-size:17px;letter-spacing:.3px;}
.sidebar .brand .tag{font-size:11px;color:#CDEEDD;margin-top:4px;}
.sidebar nav{flex:1;padding:12px 0;}
.sidebar button.navbtn{
  display:flex;align-items:center;gap:10px;width:100%;text-align:left;background:none;border:none;
  color:#E4F2E7;padding:11px 20px;font-size:13.5px;cursor:pointer;border-left:3px solid transparent;
  transition:background .15s;font-family:var(--font);
}
.sidebar button.navbtn:hover{background:rgba(255,255,255,.10);color:#fff;}
.sidebar button.navbtn.active{background:rgba(255,255,255,.16);color:#fff;border-left:3px solid var(--rosa);font-weight:700;}
.sidebar .icon{width:18px;text-align:center;font-size:14px;}
.sidebar .foot{padding:16px 20px;font-size:10.5px;color:#BFE0C9;border-top:1px solid rgba(255,255,255,.14);}

/* ---------- MAIN ---------- */
main{flex:1;padding:22px 30px 60px;max-width:1360px;}
.topbar{
  display:flex;flex-wrap:wrap;gap:14px;align-items:center;justify-content:space-between;
  background:#fff;border:1px solid var(--borde);border-radius:16px;padding:14px 20px;margin-bottom:18px;
  box-shadow:0 2px 10px rgba(140,170,150,.08);
}
.topbar .grp{display:flex;align-items:center;gap:8px;font-size:12.5px;color:var(--gris-txt);}
.topbar .grp label{font-weight:700;white-space:nowrap;}
.topbar input{padding:7px 10px;border:1px solid var(--borde);border-radius:10px;font-size:13px;background:var(--rosa-claro);font-family:var(--font);}
.topbar input#tasaDolar{width:110px;text-align:right;font-weight:700;color:var(--verde-osc);}
.topbar input#filtroFecha{width:150px;}
.topbar input#filtroMes{width:140px;}

.pagehead{display:flex;align-items:center;justify-content:space-between;margin-bottom:16px;flex-wrap:wrap;gap:10px;}
.pagehead h1{font-family:var(--font-title);font-size:22px;margin:0;color:var(--verde-osc);}
.pagehead .sub{font-size:12.5px;color:var(--gris);margin-top:3px;}

.card{background:#fff;border:1px solid var(--borde);border-radius:16px;padding:20px 22px;margin-bottom:18px;box-shadow:0 2px 10px rgba(140,170,150,.08);}
.card h2{font-family:var(--font-title);font-size:14.5px;margin:0 0 14px;color:var(--verde-osc);letter-spacing:.2px;}

/* KPI cards */
.kpi-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(190px,1fr));gap:12px;margin-bottom:20px;}
.kpi{background:linear-gradient(135deg,var(--verde-osc),var(--verde-fuerte));border-radius:16px;padding:16px 18px;color:#fff;border-left:4px solid var(--rosa);}
.kpi .t{font-size:10.5px;letter-spacing:.4px;text-transform:uppercase;color:#DCEFE0;margin-bottom:6px;font-weight:700;}
.kpi .v{font-family:var(--font-title);font-size:21px;font-weight:700;color:#fff;}
.kpi .v2{font-size:11px;color:#DCEFE0;margin-top:2px;}
.kpi.verde{background:linear-gradient(135deg,#2E6B4E,#4FB98A);border-left-color:#EAF8F1;}
.kpi.amar{background:linear-gradient(135deg,#C79A46,#DDB768);border-left-color:#FDF1DA;}
.kpi.rojo{background:linear-gradient(135deg,#C97389,#E393A9);border-left-color:#FCE6EB;}

/* Table */
.table-wrap{overflow-x:auto;max-height:480px;overflow-y:auto;}
table{width:100%;border-collapse:collapse;font-size:12.8px;}
thead th{background:var(--verde);color:#2E4A38;text-align:left;padding:10px 10px;font-weight:700;white-space:nowrap;position:sticky;top:0;}
tbody td{padding:9px 10px;border-bottom:1px solid var(--borde);}
tbody tr:hover{background:var(--verde-claro);}
tbody tr:nth-child(even){background:#FBFDFB;}
tbody tr:nth-child(even):hover{background:var(--verde-claro);}
.badge{display:inline-block;padding:3px 10px;border-radius:20px;font-size:11px;font-weight:700;white-space:nowrap;}
.badge.rojo{background:var(--rojo-bg);color:var(--rojo-txt);}
.badge.amar{background:var(--amar-bg);color:var(--amar-txt);}
.badge.verde{background:var(--verde-bg);color:var(--verde-txt);}

.row-actions{white-space:nowrap;}
.row-actions button{border:none;background:none;cursor:pointer;font-size:13px;padding:3px 6px;border-radius:8px;}
.row-actions button:hover{background:var(--verde-claro);}
.row-actions .del:hover{background:var(--rojo-bg);}

/* Buttons */
.btn{display:inline-flex;align-items:center;gap:6px;border:none;border-radius:12px;padding:10px 18px;font-size:13px;font-weight:700;cursor:pointer;transition:filter .15s,transform .1s;font-family:var(--font);}
.btn:hover{filter:brightness(1.05);}
.btn:active{transform:scale(.98);}
.btn-primary{background:var(--verde-osc);color:#fff;}
.btn-accent{background:var(--rosa);color:#6B2D3E;}
.btn-outline{background:#fff;color:var(--verde-osc);border:1.5px solid var(--verde);}
.btn-danger{background:var(--rojo-bg);color:var(--rojo-txt);}
.btn-success{background:var(--verde-bg);color:var(--verde-txt);}
.btn-sm{padding:7px 12px;font-size:12px;border-radius:10px;}
.btn-block{width:100%;justify-content:center;}

.field{margin-bottom:12px;}
.field label{display:block;font-size:11.5px;font-weight:700;color:var(--gris-txt);margin-bottom:4px;}
.field input,.field select,.field textarea{
  width:100%;padding:9px 11px;border:1px solid var(--borde);border-radius:10px;font-size:13px;font-family:var(--font);background:var(--verde-claro);
}
/* ---------- RECIBO VISUAL PARA EL CLIENTE ---------- */
.recibo-card{background:linear-gradient(160deg,var(--verde-claro),#fff);border:2px dashed var(--verde);border-radius:18px;padding:22px 20px;text-align:center;}
.recibo-emoji{font-size:30px;margin-bottom:2px;}
.recibo-brand{font-family:var(--font-title);font-weight:700;color:var(--verde-osc);font-size:15.5px;}
.recibo-doc{font-size:12px;color:var(--gris-txt);margin-top:3px;}
.recibo-fecha{font-size:11px;color:var(--gris);margin-top:1px;}
.recibo-dashed{border-top:1.5px dashed var(--verde);margin:14px 0;}
.recibo-cliente{font-size:13.5px;color:var(--gris-txt);text-align:left;margin-bottom:8px;}
.recibo-items{text-align:left;}
.recibo-item{display:flex;justify-content:space-between;gap:10px;font-size:12.5px;padding:4px 0;color:#41504A;}
.recibo-estado{margin-bottom:10px;}
.recibo-total-lbl{font-size:11px;letter-spacing:.6px;text-transform:uppercase;color:var(--gris-txt);margin-top:4px;font-weight:700;}
.recibo-total-usd{font-family:var(--font-title);font-size:32px;font-weight:700;color:var(--verde-osc);margin-top:2px;}
.recibo-total-bs{font-size:16.5px;font-weight:700;color:var(--rojo-txt);background:var(--rosa-claro);display:inline-block;padding:7px 18px;border-radius:20px;margin-top:8px;}
.recibo-tasa{font-size:11px;color:var(--gris);margin-top:9px;}
.recibo-obs{margin-top:14px;background:var(--amar-bg);color:var(--amar-txt);border-radius:10px;padding:9px 12px;font-size:12px;text-align:left;}

.field input:focus,.field select:focus,.field textarea:focus{outline:2px solid var(--rosa-fuerte);outline-offset:1px;}

.autocomplete-wrap{position:relative;}
.autocomplete-list{position:absolute;left:0;right:0;top:100%;z-index:60;background:#fff;border:1px solid var(--borde);
  border-radius:12px;max-height:230px;overflow-y:auto;margin-top:4px;box-shadow:0 10px 26px rgba(60,90,70,.16);}
.autocomplete-item{padding:9px 12px;font-size:12.8px;cursor:pointer;color:#41504A;border-bottom:1px solid var(--verde-claro);}
.autocomplete-item:last-child{border-bottom:none;}
.autocomplete-item:hover{background:var(--verde-claro);}

.notice{background:var(--rosa-claro);color:#8A4A5C;border-radius:14px;padding:12px 16px;font-size:12.5px;margin-bottom:16px;display:flex;gap:10px;align-items:flex-start;}
.notice b{white-space:nowrap;}
.empty{padding:30px;text-align:center;color:var(--gris);font-size:13px;}

.two-col{display:grid;grid-template-columns:1fr 1.4fr;gap:18px;align-items:start;}
@media (max-width:900px){ .two-col{grid-template-columns:1fr;} }

.totales-box{background:var(--verde-claro);border:1px solid var(--borde);border-radius:12px;padding:14px 16px;margin-top:6px;}
.totales-box .row{display:flex;justify-content:space-between;font-size:12.5px;color:var(--gris-txt);padding:3px 0;}
.totales-box .grand{font-family:var(--font-title);font-size:17px;font-weight:700;color:var(--verde-osc);margin-top:6px;}
.totales-box .grand2{font-size:14px;font-weight:700;color:var(--verde-txt);}

/* Modal */
.overlay{position:fixed;inset:0;background:rgba(60,80,65,.35);display:none;align-items:center;justify-content:center;z-index:50;padding:20px;}
.overlay.show{display:flex;}
.modal{background:#fff;border-radius:18px;padding:24px 28px 26px;width:100%;max-width:560px;max-height:88vh;overflow-y:auto;}
.modal h3{font-family:var(--font-title);margin:0 0 16px;color:var(--verde-osc);font-size:17px;}
.modal-actions{display:flex;justify-content:flex-end;gap:10px;margin-top:16px;}

/* ---------- FACTURACIÓN ESTILO PUNTO DE VENTA ---------- */
.pos-wrap{display:grid;grid-template-columns:1fr 300px;gap:18px;align-items:start;}
@media (max-width:1050px){ .pos-wrap{grid-template-columns:1fr;} }
.pos-main{background:#fff;border:1px solid var(--borde);border-radius:18px;padding:20px 22px;box-shadow:0 2px 10px rgba(140,170,150,.08);}
.pos-cliente{display:flex;align-items:center;gap:12px;margin-bottom:14px;flex-wrap:wrap;}
.pos-cliente label{font-family:var(--font-title);font-weight:700;color:var(--verde-osc);font-size:13.5px;white-space:nowrap;}
.pos-cliente input{flex:1;min-width:220px;padding:11px 14px;border:1.5px solid var(--verde);border-radius:12px;font-size:14px;background:var(--verde-claro);font-family:var(--font);}
.pos-entry{display:grid;grid-template-columns:2fr 1fr 1fr 90px;gap:10px;align-items:end;background:var(--rosa-claro);border-radius:14px;padding:14px 16px;margin-bottom:16px;}
.pos-entry .field{margin-bottom:0;}
.pos-entry .addbtn{background:var(--verde-osc);color:#fff;border:none;border-radius:12px;height:38px;font-weight:700;cursor:pointer;font-size:13px;}
.pos-entry .addbtn:hover{filter:brightness(1.08);}
.pos-items thead th{background:var(--verde-osc);color:#fff;}
.pos-items tbody tr.destacado{background:var(--verde-claro);}
.pos-side{background:linear-gradient(160deg,var(--verde-osc),#1F4F38);border-radius:18px;padding:20px;color:#fff;position:sticky;top:20px;}
.pos-side .doc{font-size:11px;color:#CFE9D6;letter-spacing:.5px;margin-bottom:14px;}
.pos-side .doc b{color:#fff;font-family:var(--font-title);font-size:14px;}
.pos-side .total-lbl{font-size:11px;color:#CFE9D6;letter-spacing:.6px;text-transform:uppercase;margin-bottom:4px;}
.pos-side .total-usd{font-family:var(--font-title);font-size:34px;font-weight:700;color:#fff;background:rgba(0,0,0,.18);border-radius:14px;padding:16px 14px;text-align:center;margin-bottom:12px;}
.pos-side .total-bs{background:rgba(255,255,255,.14);border-radius:12px;padding:10px 14px;text-align:center;font-size:15px;font-weight:700;margin-bottom:16px;}
.pos-side .mini-row{display:flex;justify-content:space-between;font-size:12px;color:#DCEFE0;padding:4px 0;border-bottom:1px solid rgba(255,255,255,.12);}
.pos-side select,.pos-side .field select{background:rgba(255,255,255,.92);}
.pos-side .field label{color:#DCEFE0;}
.pos-side .btn-block{margin-top:8px;}
</style>
</head>
<body>
<div id="app">
  <aside class="sidebar">
    <div class="brand">
      <div class="name" id="brandName">&#127807; Sistema Comercial</div>
      <div class="tag" id="brandTag">Facturación &amp; Deudores</div>
    </div>
    <nav id="navList"></nav>
    <div class="foot">Multimoneda &middot; Tasa histórica congelada por factura</div>
  </aside>
  <main id="content"></main>
</div>

<div class="overlay" id="overlay"><div class="modal" id="modalBox"></div></div>

<script>
// ============================================================
// CATÁLOGO BASE (de la lista original)
// ============================================================
const productosBaseOriginales = [
  "Impre/copia carta - blanco y negro", "Impre/copia doble /cara carta - b y n", "Impresión/copia carta - Color",
  "Impresión/copia oficio - blanco y negro", "Impresión/copia oficio - color", "Impresión/copia extraoficio - color",
  "Impresión/copia extraoficio - blanco y negro", "Cartulina Opalina color", "Cartulina Opalina blanco y negro",
  "6 fotos carnet", "Papel fotografico tamaño comp", "Papel fotografico medio", "Papel fotografico pequeño",
  "Papel adhesivo", "Plastificacion carnet", "Gestion Seniat", "Gestion Saime", "Edicion peq", "Edicion Gra",
  "Tesis capitulo", "Infografias", "Mapas mentales/concp/mixtos", "Ensayos", "Investigacion", "Transcripcion corta",
  "Trancripcion larga", "Diseño basico", "Diseño medio", "Diseño Pro", "Edicion de video", "Invitacion simple",
  "Invitacion video", "Flyer basico", "Flyer elaborado", "Lamina de 4 hojas", "Lamina de 6 hojas",
  "Lamina de 10 hojas", "Lamina de 16 hojas", "Lamina de 22 hojas", "Llavero personalizado", "Diseño de Cv",
  "Logo simple", "Logo basico", "Logo Pro", "Tripticos", "Apertura de cuenta bancaria"
];

// ============================================================
// ESTADO Y PERSISTENCIA
// ============================================================
const STORAGE_KEY = 'sistema-facturacion-deudores-v1';

function seedState(){
  const hoy = new Date().toISOString().split('T')[0];
  return {
    tasaActual: 800.00,
    catalogo: productosBaseOriginales.map((nombre,i)=>({id:i+1, nombre, precioUSD:1.00})),
    facturas: [],
    egresos: [],
    filtroFecha: hoy,
    filtroMes: '',
    currentView: 'dashboard',
    negocioIcono: '🍃',
    negocioNombre: 'Sistema Comercial',
    negocioTagline: 'Facturación & Deudores',
  };
}
let state = seedState();
let carritoActual = []; // temporal, no se persiste (igual que el original)

async function loadState(){
  try{
    const guardado = localStorage.getItem(STORAGE_KEY);
    if(guardado){ state = Object.assign(seedState(), JSON.parse(guardado)); }
  }catch(e){ console.error('No se pudo leer el almacenamiento local', e); }
  render();
  await intentarReconectarArchivoUSB();
}
async function saveState(){
  try{ localStorage.setItem(STORAGE_KEY, JSON.stringify(state)); }
  catch(e){ console.error('No se pudo guardar en el almacenamiento local', e); alert('No se pudo guardar. Verifica que...'); }
  if(window.guardarEnNube){ await window.guardarEnNube(state); }
  if(dataFileHandle){ await guardarEnArchivoUSB(); }
}

// ============================================================
// MODO PORTÁTIL: ARCHIVO DE DATOS EN USB (funciona sin internet)
// Usa la File System Access API para leer/escribir un archivo real
// en el USB, para poder usar el sistema desde 2+ computadores con
// los mismos datos, sin depender del navegador de cada equipo.
// Soportado en Chrome / Edge / Opera. No soportado en Firefox / Safari
// (en esos casos usar el respaldo manual de la sección Configuración).
// ============================================================
let dataFileHandle = null;
const FS_SUPPORTED = 'showOpenFilePicker' in window;

function idbAbrir(){
  return new Promise((resolve,reject)=>{
    const req = indexedDB.open('sfd-handles-db', 1);
    req.onupgradeneeded = () => { req.result.createObjectStore('handles'); };
    req.onsuccess = () => resolve(req.result);
    req.onerror = () => reject(req.error);
  });
}
async function idbGuardarHandle(handle){
  try{
    const db = await idbAbrir();
    await new Promise((res,rej)=>{
      const tx = db.transaction('handles','readwrite');
      tx.objectStore('handles').put(handle, 'archivoDatos');
      tx.oncomplete = res; tx.onerror = () => rej(tx.error);
    });
  }catch(e){ console.error('No se pudo recordar el archivo conectado', e); }
}
async function idbLeerHandle(){
  try{
    const db = await idbAbrir();
    return await new Promise((res,rej)=>{
      const tx = db.transaction('handles','readonly');
      const req = tx.objectStore('handles').get('archivoDatos');
      req.onsuccess = () => res(req.result || null);
      req.onerror = () => rej(req.error);
    });
  }catch(e){ return null; }
}
async function crearArchivoDatosUSB(){
  if(!FS_SUPPORTED){ alert('Tu navegador no soporta el Modo Portátil (usa Chrome o Edge). Mientras tanto, usa "Descargar Respaldo" y "Restaurar desde Respaldo" para mover los datos entre computadores.'); return; }
  try{
    const handle = await window.showSaveFilePicker({
      suggestedName: 'datos-sistema-comercial.json',
      types: [{description:'Datos del Sistema Comercial', accept:{'application/json':['.json']}}]
    });
    dataFileHandle = handle;
    await idbGuardarHandle(handle);
    await guardarEnArchivoUSB();
    actualizarEstadoConexionArchivo();
    alert('Listo. Guarda ese archivo dentro de tu USB. Desde el otro computador, usa el botón "Conectar Archivo Existente" y selecciona ese mismo archivo.');
  }catch(e){ /* el usuario cerró el selector, no hacemos nada */ }
}
async function conectarArchivoDatosUSB(){
  if(!FS_SUPPORTED){ alert('Tu navegador no soporta el Modo Portátil (usa Chrome o Edge). Mientras tanto, usa "Descargar Respaldo" y "Restaurar desde Respaldo" para mover los datos entre computadores.'); return; }
  try{
    const [handle] = await window.showOpenFilePicker({
      types: [{description:'Datos del Sistema Comercial', accept:{'application/json':['.json']}}]
    });
    dataFileHandle = handle;
    await idbGuardarHandle(handle);
    if(confirm('¿Deseas CARGAR ahora los datos que hay dentro de ese archivo? (Reemplazará lo que ves en pantalla en este computador)')){
      await cargarDesdeArchivoUSB();
    } else {
      await guardarEnArchivoUSB();
    }
    actualizarEstadoConexionArchivo();
  }catch(e){ /* el usuario cerró el selector, no hacemos nada */ }
}
async function guardarEnArchivoUSB(){
  if(!dataFileHandle) return;
  try{
    const perm = await dataFileHandle.requestPermission({mode:'readwrite'});
    if(perm !== 'granted') return;
    const writable = await dataFileHandle.createWritable();
    await writable.write(JSON.stringify(state, null, 2));
    await writable.close();
  }catch(e){ console.error('No se pudo guardar en el archivo del USB', e); }
}
async function cargarDesdeArchivoUSB(){
  if(!dataFileHandle) return;
  try{
    const perm = await dataFileHandle.requestPermission({mode:'readwrite'});
    if(perm !== 'granted') return;
    const file = await dataFileHandle.getFile();
    const texto = await file.text();
    if(texto && texto.trim()){
      state = Object.assign(seedState(), JSON.parse(texto));
      await saveState(); render();
    }
  }catch(e){ console.error('No se pudo leer el archivo del USB', e); alert('No se pudo leer el archivo. Puede que hayas desconectado el USB.'); }
}
async function intentarReconectarArchivoUSB(){
  if(!FS_SUPPORTED) return;
  const handle = await idbLeerHandle();
  if(!handle) return;
  try{
    const perm = await handle.queryPermission({mode:'readwrite'});
    if(perm === 'granted'){ dataFileHandle = handle; actualizarEstadoConexionArchivo(); }
  }catch(e){ /* el archivo ya no existe o el USB no está conectado */ }
}
function actualizarEstadoConexionArchivo(){
  const el = document.getElementById('estadoArchivoUSB');
  if(!el) return;
  el.innerHTML = dataFileHandle
    ? `&#9989; Conectado a: <b>${dataFileHandle.name}</b>. Cada cambio se guarda ahí automáticamente.`
    : (FS_SUPPORTED ? `&#9888;&#65039; Aún no conectado a ningún archivo portátil. Los datos solo viven en este navegador.` : `&#10060; Tu navegador no soporta el Modo Portátil. Usa el respaldo manual para mover datos entre computadores.`);
}

// ============================================================
// UTILIDADES
// ============================================================
const fmtUSD = n => (Number(n)||0).toFixed(2) + ' $';
const fmtBs  = n => (Number(n)||0).toLocaleString('es-VE',{minimumFractionDigits:2,maximumFractionDigits:2}) + ' Bs';
const uid = () => Date.now() + Math.floor(Math.random()*1000);
const hoyStr = () => new Date().toISOString().split('T')[0];
const DIAS_SEM = ['Domingo','Lunes','Martes','Miércoles','Jueves','Viernes','Sábado'];
const MESES_L = ['Enero','Febrero','Marzo','Abril','Mayo','Junio','Julio','Agosto','Septiembre','Octubre','Noviembre','Diciembre'];
function fmtDatePretty(d){
  if(!d) return '';
  const dt = new Date(d+'T00:00:00');
  if(isNaN(dt)) return d;
  return `${DIAS_SEM[dt.getDay()]} ${dt.getDate()} de ${MESES_L[dt.getMonth()]} de ${dt.getFullYear()}`;
}
function diasDesde(fecha){
  const dt = new Date(fecha+'T00:00:00');
  const hoy = new Date(hoyStr()+'T00:00:00');
  const diff = Math.round((hoy-dt)/86400000);
  return diff>=0 ? diff : 0;
}

function badgeEstado(e){
  const map = {Cancelado:'verde', Pendiente:'amar'};
  return `<span class="badge ${map[e]||'amar'}">${e}</span>`;
}

function facturasFiltradas(){
  let lista = state.facturas;
  if(state.filtroMes) return lista.filter(f=>f.fecha.startsWith(state.filtroMes));
  if(state.filtroFecha) return lista.filter(f=>f.fecha===state.filtroFecha);
  return lista;
}
function egresosFiltrados(){
  let lista = state.egresos;
  if(state.filtroMes) return lista.filter(e=>e.fecha.startsWith(state.filtroMes));
  if(state.filtroFecha) return lista.filter(e=>e.fecha===state.filtroFecha);
  return lista;
}

function calcularEstadisticas(){
  const fF = facturasFiltradas();
  const eF = egresosFiltrados();
  const totalVentasUSD = fF.reduce((s,f)=>s+f.totalUSD,0);
  const totalVentasBS = fF.reduce((s,f)=>s+f.totalBS,0);
  const cobradas = fF.filter(f=>f.estado==='Cancelado');
  const totalCobradoUSD = cobradas.reduce((s,f)=>s+f.totalUSD,0);
  const totalCobradoBS = cobradas.reduce((s,f)=>s+f.totalBS,0);
  const pendientes = state.facturas.filter(f=>f.estado==='Pendiente');
  const totalPendienteUSD = pendientes.reduce((s,f)=>s+f.totalUSD,0);
  const totalPendienteBS = totalPendienteUSD * state.tasaActual;
  const totalEgresosUSD = eF.reduce((s,e)=>s+e.montoUSD,0);
  const totalEgresosBS = eF.reduce((s,e)=>s+e.montoBS,0);
  return {totalVentasUSD,totalVentasBS,totalCobradoUSD,totalCobradoBS,totalPendienteUSD,totalPendienteBS,totalEgresosUSD,totalEgresosBS};
}
function renderDashboard(){
  const s = calcularEstadisticas();
  const rango = state.filtroMes ? `mes ${state.filtroMes}` : (state.filtroFecha ? `fecha ${state.filtroFecha}` : 'todo el historial');
  return `

  <div class="kpi-grid">
    <div class="kpi"><div class="t">Ventas del Periodo ($)</div><div class="v">${fmtUSD(s.totalVentasUSD)}</div><div class="v2">${fmtBs(s.totalVentasBS)}</div></div>
    <div class="kpi verde"><div class="t">Cobrado / Cancelado ($)</div><div class="v">${fmtUSD(s.totalCobradoUSD)}</div><div class="v2">${fmtBs(s.totalCobradoBS)}</div></div>
    <div class="kpi amar"><div class="t">Por Cobrar Hasta la Fecha</div><div class="v">${fmtUSD(s.totalPendienteUSD)}</div><div class="v2">${fmtBs(s.totalPendienteBS)} (al cambio hoy)</div></div>
    <div class="kpi rojo"><div class="t">Egresos / Gastos del Periodo</div><div class="v">${fmtUSD(s.totalEgresosUSD)}</div><div class="v2">${fmtBs(s.totalEgresosBS)}</div></div>
  </div>
  <div class="notice"><b>&#9432;</b> Los montos por cobrar se recalculan siempre a la tasa del día actual (${state.tasaActual.toFixed(2)} Bs/$), mientras que las ventas ya canceladas conservan la tasa histórica del momento en que se generaron.</div>

      <tbody>
      ${state.facturas.length? [...state.facturas].reverse().slice(0,8).map(f=>`
        <tr><td>${f.numeroFactura}</td><td>${f.fecha}</td><td>${f.cliente}</td><td>${fmtUSD(f.totalUSD)}</td><td>${badgeEstado(f.estado)}</td></tr>

// ------------------------------------------------------------
// GANANCIAS POR PERIODO (Hoy / Semana / Mes) — usa la tasa histórica
// congelada de cada factura o egreso, NO la tasa de hoy.
// ------------------------------------------------------------
function pad2(n){ return String(n).padStart(2,'0'); }
function dateToStr(d){ return `${d.getFullYear()}-${pad2(d.getMonth()+1)}-${pad2(d.getDate())}`; }
function inicioFinSemana(baseStr){
  const hoy = new Date((baseStr||hoyStr())+'T00:00:00');
  const dow = hoy.getDay(); // 0=domingo..6=sábado
  const diffLunes = dow===0 ? 6 : dow-1;
  const lunes = new Date(hoy); lunes.setDate(hoy.getDate()-diffLunes);
  const domingo = new Date(lunes); domingo.setDate(lunes.getDate()+6);
  return [dateToStr(lunes), dateToStr(domingo)];
}
function inicioFinMes(baseStr){
  const hoy = new Date((baseStr||hoyStr())+'T00:00:00');
  const inicio = `${hoy.getFullYear()}-${pad2(hoy.getMonth()+1)}-01`;
  const finDate = new Date(hoy.getFullYear(), hoy.getMonth()+1, 0);
  return [inicio, dateToStr(finDate)];
}
function statsRango(fechaInicio, fechaFin){
  const enRango = f => f>=fechaInicio && f<=fechaFin;
  const fRango = state.facturas.filter(f=>enRango(f.fecha));
  const eRango = state.egresos.filter(e=>enRango(e.fecha));
  const cobradas = fRango.filter(f=>f.estado==='Cancelado');
  const totalCobradoUSD = cobradas.reduce((s,f)=>s+f.totalUSD,0);
  const totalCobradoBS = cobradas.reduce((s,f)=>s+f.totalBS,0);
  const totalFacturadoUSD = fRango.reduce((s,f)=>s+f.totalUSD,0);
  const totalFacturadoBS = fRango.reduce((s,f)=>s+f.totalBS,0);
  const totalEgresosUSD = eRango.reduce((s,e)=>s+e.montoUSD,0);
  const totalEgresosBS = eRango.reduce((s,e)=>s+e.montoBS,0);
  return {
    totalCobradoUSD, totalCobradoBS, totalFacturadoUSD, totalFacturadoBS,
    totalEgresosUSD, totalEgresosBS,
    netoUSD: totalCobradoUSD-totalEgresosUSD, netoBS: totalCobradoBS-totalEgresosBS,
    nFacturas: fRango.length, nCobradas: cobradas.length
  };
}
function bloqueReporte(titulo, sub, s){
  return `
    <div class="card">
      <h2>${titulo}</h2>
      <div class="sub" style="margin:-8px 0 14px;font-size:11.5px;color:var(--gris);">${sub} &middot; ${s.nCobradas} factura(s) cobrada(s) de ${s.nFacturas} emitida(s)</div>
      <div class="kpi-grid">
        <div class="kpi verde"><div class="t">Cobrado (Ingreso real)</div><div class="v">${fmtUSD(s.totalCobradoUSD)}</div><div class="v2">${fmtBs(s.totalCobradoBS)}</div></div>
        <div class="kpi rojo"><div class="t">Egresos</div><div class="v">${fmtUSD(s.totalEgresosUSD)}</div><div class="v2">${fmtBs(s.totalEgresosBS)}</div></div>
        <div class="kpi"><div class="t">Ganancia Neta</div><div class="v">${fmtUSD(s.netoUSD)}</div><div class="v2">${fmtBs(s.netoBS)}</div></div>
        <div class="kpi amar"><div class="t">Facturado Total (incl. fiado)</div><div class="v">${fmtUSD(s.totalFacturadoUSD)}</div><div class="v2">${fmtBs(s.totalFacturadoBS)}</div></div>
      </div>
    </div>
  `;
}
function renderReportes(){
  const hoy = hoyStr();
  const [lunes, domingo] = inicioFinSemana(hoy);
  const [inicioMes, finMes] = inicioFinMes(hoy);
  const mesLbl = MESES_L[new Date(hoy+'T00:00:00').getMonth()] + ' ' + hoy.substring(0,4);

  const sHoy = statsRango(hoy, hoy);
  const sSemana = statsRango(lunes, domingo);
  const sMes = statsRango(inicioMes, finMes);

  return `
  <div class="pagehead"><div><h1>&#128200; Ganancias por Periodo</h1>
  <div class="sub">Cada venta y gasto conserva la tasa Bs/$ del día en que ocurrió; por eso los bolívares aquí no cambian aunque cambies la tasa de hoy.</div></div></div>
  ${bloqueReporte('Hoy', fmtDatePretty(hoy), sHoy)}
  ${bloqueReporte('Esta Semana', `Lunes ${lunes} al Domingo ${domingo}`, sSemana)}
  ${bloqueReporte('Este Mes', mesLbl, sMes)}
  `;
}

// COMBO BUSCABLE DE PRODUCTOS (escribir o elegir de la lista)
// Se reutiliza con prefijo 'v' (Nueva Factura) y 'ef' (Editar Factura)
// ------------------------------------------------------------
function filtrarProductosCombo(prefix){
  const input = document.getElementById(prefix+'ProductoInput');
  const lista = document.getElementById(prefix+'ProductoLista');
  if(!input || !lista) return;
  const q = input.value.trim().toLowerCase();
  const matches = q ? state.catalogo.filter(p=>p.nombre.toLowerCase().includes(q)) : state.catalogo;
  if(!matches.length){
    lista.innerHTML = `<div class="autocomplete-item" style="color:var(--gris);cursor:default;">Sin resultados para "${input.value}"</div>`;
  } else {
    lista.innerHTML = matches.slice(0,60).map(p=>`
      <div class="autocomplete-item" onmousedown="seleccionarProductoCombo('${prefix}',${p.id})">${p.nombre} <span style="color:var(--gris);float:right;">$${p.precioUSD.toFixed(2)}</span></div>
    `).join('');
  }
  lista.style.display = 'block';
}
function ocultarListaCombo(prefix){
  const lista = document.getElementById(prefix+'ProductoLista');
  if(lista) lista.style.display = 'none';
}
function seleccionarProductoCombo(prefix, id){
  const prod = state.catalogo.find(p=>p.id==id);
  if(!prod) return;
  document.getElementById(prefix+'ProductoInput').value = prod.nombre;
  document.getElementById(prefix+'ProductoIdSel').value = prod.id;
  ocultarListaCombo(prefix);
  if(prefix==='v'){
    document.getElementById('vPrecioUnitarioUSD').value = prod.precioUSD;
    document.getElementById('vCantidad').value = 1;
    calcularSubtotalItem();
  } else if(prefix==='ef'){
    document.getElementById('efPrecio').value = prod.precioUSD;
  }
}
function calcularSubtotalItem(){
  const cant = parseFloat(document.getElementById('vCantidad').value) || 0;
  const precioU = parseFloat(document.getElementById('vPrecioUnitarioUSD').value) || 0;
  const subUSD = cant*precioU;
  document.getElementById('lblSubtotalItemUSD').textContent = subUSD.toFixed(2);
  document.getElementById('lblSubtotalItemBS').textContent = (subUSD*state.tasaActual).toLocaleString('es-VE',{minimumFractionDigits:2,maximumFractionDigits:2});
}
function agregarItemAlCarrito(){
  const input = document.getElementById('vProductoInput');
  const hidden = document.getElementById('vProductoIdSel');
  let idSel = hidden.value;
  const cant = parseFloat(document.getElementById('vCantidad').value) || 0;
  const precioU = parseFloat(document.getElementById('vPrecioUnitarioUSD').value) || 0;
  // Si escribió el nombre exacto sin hacer clic en la sugerencia, lo buscamos igual
  if(!idSel && input.value.trim()){
    const match = state.catalogo.find(p=>p.nombre.toLowerCase()===input.value.trim().toLowerCase());
    if(match) idSel = match.id;
  }
  if(!idSel){ alert('Por favor escribe y selecciona un producto de la lista del catálogo.'); return; }
  if(cant<=0){ alert('La cantidad debe ser mayor a cero.'); return; }
  const prod = state.catalogo.find(p=>p.id==idSel);
  carritoActual.push({productoId:prod.id, nombre:prod.nombre, cantidad:cant, precioUnitarioUSD:precioU, subtotalUSD:cant*precioU});
  input.value = ''; hidden.value = ''; document.getElementById('vCantidad').value = 1; document.getElementById('vPrecioUnitarioUSD').value = '';
  document.getElementById('lblSubtotalItemUSD').textContent = '0.00'; document.getElementById('lblSubtotalItemBS').textContent = '0.00';
  renderCarritoTabla(); renderTotalesFactura();
}
function renderCarritoTabla(){
  const tbody = document.getElementById('tablaCarrito');
  if(!tbody) return;
  if(carritoActual.length===0){
    tbody.innerHTML = `<tr><td colspan="6" class="empty">Aún no has añadido artículos a esta factura.</td></tr>`; return;
  }
  tbody.innerHTML = carritoActual.map((it,i)=>`
    <tr class="${i===carritoActual.length-1?'destacado':''}"><td>${it.nombre}</td><td>$${it.precioUnitarioUSD.toFixed(2)}</td><td>${it.cantidad}</td>
    <td><b>$${it.subtotalUSD.toFixed(2)}</b></td><td>${fmtBs(it.subtotalUSD*state.tasaActual)}</td>
    <td class="row-actions"><button class="del" onclick="quitarItemCarrito(${i})">&#10005;</button></td></tr>
  `).join('');
}
function renderTotalesFactura(){
  const totalUSD = carritoActual.reduce((s,it)=>s+it.subtotalUSD,0);
  const cantItems = carritoActual.reduce((s,it)=>s+Number(it.cantidad),0);
  const elU = document.getElementById('lblTotalFacturaUSD'), elB = document.getElementById('lblTotalFacturaBS'), elC = document.getElementById('lblTotalCantItems');
  if(elU) elU.textContent = fmtUSD(totalUSD);
  if(elB) elB.textContent = fmtBs(totalUSD*state.tasaActual);
  if(elC) elC.textContent = cantItems;
}
function quitarItemCarrito(i){ carritoActual.splice(i,1); renderCarritoTabla(); renderTotalesFactura(); }
function vaciarCarrito(){ carritoActual=[]; renderCarritoTabla(); renderTotalesFactura(); }
function procesarFactura(){
  const cliente = document.getElementById('vCliente').value.trim();
  const estadoPago = document.getElementById('vEstadoPago').value;
  const observacion = document.getElementById('vObservacion') ? document.getElementById('vObservacion').value.trim() : '';
  const fecha = state.filtroFecha || hoyStr();
  if(!cliente){ alert('Por favor ingresa el nombre del cliente.'); return; }
  if(carritoActual.length===0){ alert('La factura está vacía. Añade al menos un artículo antes de guardar.'); return; }
  const totalUSD = carritoActual.reduce((s,it)=>s+it.subtotalUSD,0);
  const nuevaFactura = {
    id: uid(), numeroFactura: 'FAC-'+String(state.facturas.length+1).padStart(4,'0'),
    fecha, cliente, items:[...carritoActual], totalUSD,
    tasaHistorica: state.tasaActual, totalBS: totalUSD*state.tasaActual, estado: estadoPago,
    observacion: observacion || ''
  };
  state.facturas.push(nuevaFactura);
  facturaClienteTmp = '';
  vaciarCarrito();
  saveState();
  goTo(estadoPago==='Pendiente' ? 'deudores' : 'historial');
  generarReciboCliente(nuevaFactura.id);
}

function generarReciboCliente(id){

  const totalBsHoy = f.totalUSD * state.tasaActual;
  const itemsHtml = f.items.map(i=>`<div class="recibo-item"><span>${i.cantidad}x ${i.nombre}</span><span>$${i.subtotalUSD.toFixed(2)}</span></div>`).join('');
  const body = `
    <div class="recibo-card">
      <div class="recibo-emoji">&#128424;&#65039;&#128155;</div>
      <div class="recibo-brand">${state.negocioNombre||'Sistema Comercial'}</div>
      <div class="recibo-doc">Factura ${f.numeroFactura}</div>
      <div class="recibo-fecha">${fmtDatePretty(f.fecha)}</div>
      <div class="recibo-dashed"></div>
      <div class="recibo-cliente">&#128100; <b>Cliente:</b> ${f.cliente}</div>
      <div class="recibo-items">${itemsHtml}</div>
      <div class="recibo-dashed"></div>
      <div class="recibo-estado">${badgeEstado(f.estado)}</div>
      <div class="recibo-total-lbl">Total a Cancelar</div>
      <div class="recibo-total-usd">${fmtUSD(f.totalUSD)}</div><br>
      <span class="recibo-total-bs">${fmtBs(totalBsHoy)}</span>
      <div class="recibo-tasa">&#128176; Tasa del día de hoy: ${state.tasaActual.toFixed(2)} Bs/$</div>
      ${f.observacion? `<div class="recibo-obs">&#128221; ${f.observacion}</div>` : ''}
    </div>
    <div style="margin-top:14px;">
      <button class="btn btn-primary btn-block" onclick="copiarMensajeRecibo(${f.id})">&#128203; Copiar Mensaje para WhatsApp</button>
    </div>
    <div class="notice" style="margin-top:12px;margin-bottom:0;"><b>&#128248;</b> Toma una captura de esta tarjeta para enviarla como imagen, o usa el botón de arriba para copiar un mensaje listo para pegar en WhatsApp.</div>
  `;
  openModal('&#129534; Recibo para el Cliente', body);
}
function copiarMensajeRecibo(id){
  const f = state.facturas.find(x=>x.id==id);
  if(!f) return;
  const totalBsHoy = f.totalUSD * state.tasaActual;
  const itemsTxt = f.items.map(i=>`• ${i.cantidad}x ${i.nombre} - $${i.subtotalUSD.toFixed(2)}`).join('\n');
  const estadoTxt = f.estado==='Pendiente' ? '\n⏳ Estado: Pendiente por cobrar' : '\n✅ Estado: Cancelado';
  const msg = `🖨️ *${state.negocioNombre||'Sistema Comercial'}*\nFactura ${f.numeroFactura} - ${fmtDatePretty(f.fecha)}\nCliente: ${f.cliente}\n\n${itemsTxt}\n\n💵 Total: ${fmtUSD(f.totalUSD)}\n💚 Equivalente hoy: ${fmtBs(totalBsHoy)}\n(Tasa: ${state.tasaActual.toFixed(2)} Bs/$)${estadoTxt}`;
  if(navigator.clipboard && navigator.clipboard.writeText){
    navigator.clipboard.writeText(msg).then(()=>{
      alert('¡Mensaje copiado! Ya puedes pegarlo en WhatsApp.');
    }).catch(()=>{
      prompt('Copia este mensaje manualmente:', msg);
    });
  } else {
    prompt('Copia este mensaje manualmente:', msg);
  }
}
function eliminarFactura(id){
  if(confirm('¿Estás seguro de eliminar esta factura del historial?')){
    state.facturas = state.facturas.filter(f=>f.id!=id);
    saveState(); render();
  }
}

      <div class="row"><span>TOTAL (Bs) a la tasa indicada:</span><span id="efTotalBS"><b>0.00 Bs</b></span></div>
    </div>

      <button class="btn btn-primary" onclick="guardarEdicionFactura()">&#10003; Guardar Cambios</button>
    </div>
  `;

  renderTablaEdicionItems();
}
function agregarItemEdicion(){
  const input = document.getElementById('efProductoInput');
  const hidden = document.getElementById('efProductoIdSel');
  let idSel = hidden.value;
  const precio = parseFloat(document.getElementById('efPrecio').value) || 0;
  const cant = parseFloat(document.getElementById('efCantidad').value) || 0;
  if(!idSel && input.value.trim()){
    const match = state.catalogo.find(p=>p.nombre.toLowerCase()===input.value.trim().toLowerCase());
    if(match) idSel = match.id;
  }
  if(!idSel){ alert('Escribe y selecciona un producto de la lista del catálogo.'); return; }
  if(cant<=0){ alert('La cantidad debe ser mayor a cero.'); return; }
  const prod = state.catalogo.find(p=>p.id==idSel);
  facturaEditItems.push({productoId:prod.id, nombre:prod.nombre, cantidad:cant, precioUnitarioUSD:precio, subtotalUSD:cant*precio});
  input.value=''; hidden.value=''; document.getElementById('efPrecio').value=''; document.getElementById('efCantidad').value=1;
  renderTablaEdicionItems();
}
function quitarItemEdicion(i){ facturaEditItems.splice(i,1); renderTablaEdicionItems(); }
function renderTablaEdicionItems(){
  const tbody = document.getElementById('tablaEdicionItems');
  if(!tbody) return;
  tbody.innerHTML = facturaEditItems.length? facturaEditItems.map((it,i)=>`
    <tr><td>${it.nombre}</td><td>$${it.precioUnitarioUSD.toFixed(2)}</td><td>${it.cantidad}</td><td>$${it.subtotalUSD.toFixed(2)}</td>
    <td class="row-actions"><button class="del" onclick="quitarItemEdicion(${i})">&#10005;</button></td></tr>
  `).join('') : `<tr><td colspan="5" class="empty">Sin artículos. Añade al menos uno.</td></tr>`;
  const totalUSD = facturaEditItems.reduce((s,it)=>s+it.subtotalUSD,0);
  const tasaInput = document.getElementById('efTasa');
  const tasa = tasaInput ? (parseFloat(tasaInput.value)||0) : 0;
  const u = document.getElementById('efTotalUSD'), b = document.getElementById('efTotalBS');
  if(u) u.innerHTML = `<b>${fmtUSD(totalUSD)}</b>`;
  if(b) b.innerHTML = `<b>${fmtBs(totalUSD*tasa)}</b>`;
}
function guardarEdicionFactura(){
  const i = state.facturas.findIndex(f=>f.id==facturaEditId);
  if(i===-1) return;
  const cliente = document.getElementById('efCliente').value.trim();
  const fecha = document.getElementById('efFecha').value;
  const estado = document.getElementById('efEstado').value;
  const tasa = parseFloat(document.getElementById('efTasa').value) || 0;
  const observacion = document.getElementById('efObservacion').value.trim();
  if(!cliente){ alert('El nombre del cliente es obligatorio.'); return; }
  if(!fecha){ alert('La fecha es obligatoria.'); return; }
  if(facturaEditItems.length===0){ alert('La factura debe tener al menos un artículo.'); return; }
  const totalUSD = facturaEditItems.reduce((s,it)=>s+it.subtotalUSD,0);
  state.facturas[i] = {
    ...state.facturas[i],
    cliente, fecha, estado, observacion,
    items: [...facturaEditItems],
    totalUSD, tasaHistorica: tasa, totalBS: totalUSD*tasa
  };
  facturaEditId = null; facturaEditItems = [];
  closeModal();
  saveState(); render();
}

  return `

  <div class="notice"><b>&#9888;</b> El monto original en dólares se mantiene exacto desde el día que fiaron. Los bolívares a cobrar se recalculan automáticamente usando la <b>tasa del día actual</b> para proteger contra la devaluación.</div>
  <div class="card"><div class="table-wrap"><table>
    <thead><tr><th>Debe Desde</th><th>Días</th><th>Cliente</th><th>Detalle</th><th>Monto Fijo ($)</th><th>Monto a Cobrar HOY (Bs)</th><th>Observación</th><th>Acción</th></tr></thead>
    <tbody>
    ${pendientes.length? pendientes.map(f=>{
      const detalle = f.items.map(i=>`${i.cantidad}x ${i.nombre}`).join(', ');
      const montoBsHoy = f.totalUSD * state.tasaActual;
      const dias = diasDesde(f.fecha);
      return `<tr><td>${f.fecha}</td><td><span class="badge ${dias>15?'rojo':'amar'}">${dias} día(s)</span></td><td><b>${f.cliente}</b></td><td><small>${detalle}</small></td>
      <td><b>${fmtUSD(f.totalUSD)}</b></td><td style="color:var(--rojo-txt);"><b>${fmtBs(montoBsHoy)}</b></td>
      <td><input type="text" value="${(f.observacion||'').replace(/"/g,'&quot;')}" placeholder="Escribe una nota..." style="min-width:160px;padding:6px 8px;border:1px solid var(--borde);border-radius:8px;background:var(--rosa-claro);font-size:12px;" onchange="guardarObservacion(${f.id}, this.value)"></td>
      <td><button class="btn btn-success btn-sm" onclick="cobrarDeuda(${f.id})">&#128176; Cobrar HOY</button> <button class="btn btn-outline btn-sm" onclick="generarReciboCliente(${f.id})">&#129534; Recibo</button></td></tr>`;
    }).join('') : `<tr><td colspan="8" class="empty">Excelente. No existen cuentas pendientes por cobrar.</td></tr>`}
    </tbody>
  </table></div></div>
  `;
}
function guardarObservacion(id, valor){
  const i = state.facturas.findIndex(f=>f.id==id);
  if(i===-1) return;
  state.facturas[i].observacion = valor;
  saveState();
}
function cobrarDeuda(id){
  const i = state.facturas.findIndex(f=>f.id==id);
  if(i===-1) return;
  if(confirm(`¿Marcar factura de ${state.facturas[i].cliente} como PAGADA HOY a la tasa de ${state.tasaActual.toFixed(2)} Bs/$?`)){
    state.facturas[i].estado = 'Cancelado';
    state.facturas[i].tasaHistorica = state.tasaActual;
    state.facturas[i].totalBS = state.facturas[i].totalUSD * state.tasaActual;
    saveState(); render();
  }
}

}

function guardarDatosNegocio(){
  state.negocioIcono = document.getElementById('cfgIcono').value.trim() || '🍃';
  state.negocioNombre = document.getElementById('cfgNombre').value.trim() || 'Sistema Comercial';
  state.negocioTagline = document.getElementById('cfgTagline').value.trim() || 'Facturación & Deudores';
  saveState();
  actualizarMarca();
  alert('Datos del negocio guardados con éxito.');
}
function descargarRespaldo(){
  const blob = new Blob([JSON.stringify(state, null, 2)], {type:'application/json'});
  const url = URL.createObjectURL(blob);
  const a = document.createElement('a');
  a.href = url;
  a.download = `respaldo-sistema-${hoyStr()}.json`;
  document.body.appendChild(a);
  a.click();
  a.remove();
  URL.revokeObjectURL(url);
}
function restaurarRespaldo(event){
  const file = event.target.files[0];
  if(!file) return;
  const reader = new FileReader();
  reader.onload = e => {
    try{
      const datos = JSON.parse(e.target.result);
      if(!confirm('Esto reemplazará TODA la información actual con la del archivo de respaldo. ¿Deseas continuar?')) return;
      state = Object.assign(seedState(), datos);
      saveState(); render();
      alert('Respaldo restaurado con éxito.');
    }catch(err){
      alert('El archivo no es un respaldo válido (formato JSON incorrecto).');
    }
  };
  reader.readAsText(file);
  event.target.value = '';
}
function reiniciarTodo(){
  if(confirm('¿Estás SEGURO de borrar TODA la información (facturas, deudores, egresos, catálogo)? Esta acción no se puede deshacer.')){
    if(confirm('Última confirmación: se perderá todo permanentemente. ¿Continuar?')){
      state = seedState();
      saveState(); render();
      alert('El sistema fue reiniciado a sus valores originales.');
    }
  }
}
function guardarEdicionAvanzada(){
  const texto = document.getElementById('cfgJsonAvanzado').value;
  try{
    const datos = JSON.parse(texto);
    if(!confirm('¿Deseas guardar estos cambios avanzados? Reemplazarán la información actual del sistema.')) return;
    state = Object.assign(seedState(), datos);
    saveState(); render();
    alert('Cambios avanzados guardados con éxito.');
  }catch(err){
    alert('El texto no es un JSON válido. Revisa el formato antes de guardar.');
  }
}
